name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml run these same gates on the tagged commit.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs, except on tags (the release depends on them).
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Pure-Go E2EE, matching the cgo-free release build.
env:
  GOFLAGS: -tags=goolm

jobs:
  # Every step below is a make target, so the gates, their tools and the Go toolchain
  # (go.mod's `toolchain`, which the Makefile pins) are the same here and in `make
  # check`. scripts/ci-parity-check.sh (the ci-parity gate) holds the two lists equal.

  # Whether a pull request changes docs alone (scripts/docs-only.sh). Then the docs and
  # secrets gates run and the others skip themselves, which ci-ok accepts for such a PR
  # only. Pushes to main and the release's run (workflow_call) run every gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A pull request of docs alone?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT" = pull_request ] && git diff --name-only "$BASE...$HEAD" | bash scripts/docs-only.sh; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Before the build, so an untidy go.mod fails here and not at release time.
      - name: Modules are tidy and verified, and every package builds as released
        run: make mod-check compile

  # Race detector and a coverage profile, split over parallel runners by package group
  # (TEST_GROUP in the Makefile): the two slowest packages on their own, the network
  # adapters together, and the rest. One job's 15 minutes held them all before, and no longer did.
  test:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [db, tui, adapters, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with the race detector
        env:
          GROUP: ${{ matrix.group }}
        run: make test TEST_GROUP=$GROUP COVERPROFILE=cover-$GROUP.out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-${{ matrix.group }}
          path: cover-${{ matrix.group }}.out
          retention-days: 1

  # The coverage floors over the groups' profiles, merged (with a summary).
  coverage:
    needs: [changes, test]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          merge-multiple: true

      - name: Coverage gate
        run: make coverage-gate COVERPROFILES=cover-*.out

  # What a release ships, built only for one (release.yml calls this workflow on the
  # tag; a PR builds for linux alone): every CROSS_TARGETS platform, compile-only (the
  # release targets plus windows, built, not released), and the Nix flake (flake.lock
  # and vendorHash current; see nix-check in the Makefile). vendorHash changes with
  # every package newly imported, not only with go.mod, so a PR does not wait on it;
  # the weekly workflow builds the flake too, so a stale hash shows within a week.
  release-builds:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every CROSS_TARGETS platform
        run: make cross

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Build the Nix flake
        env:
          REQUIRE_NIX: "1"
        run: make nix-check

  # Repo guards: pins, unit parity, the layer map, and this file against `make check`.
  repo-checks:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Actions SHA pins, unit parity, layering, CI parity, the gate scripts' tests
        run: make pin-check unit-check arch-check ci-parity script-check

  # Validates .goreleaser.yaml without building, with the release's goreleaser.
  release-config:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: goreleaser check
        run: make release-check

  # golangci-lint is pinned by the go.mod tool directive.
  lint:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint and format check (gofmt/goimports)
        run: make lint fmt-check

  # govulncheck is a go.mod tool; npm audit covers markdownlint's lock and the desktop's
  # runtime tree.
  vuln:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # markdownlint and npm audit run on node: pinned, as every other tool is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Vulnerability scan
        run: make vuln

  # The CLI at tools/versions.env's version and checksum, not gitleaks-action: the
  # action's PR-commit API call 403s on fork and Dependabot PRs.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so gitleaks scans every commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # History (needs fetch-depth: 0) and working tree cover disjoint ground.
      # CHECK_STRICT: a missing history is a failure here, never a skip.
      - name: Scan history and working tree
        run: make secrets CHECK_STRICT=1

  # Generated wire types must match api/proto (buf at tools/versions.env's version; the
  # desktop's TypeScript by protoc-gen-es from tools/protoc-gen-es's lock).
  proto:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # protoc-gen-es runs on node: pinned, as every other tool is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Lints, generates into a scratch dir and compares file by file, so a new
      # (untracked) generated file fails it too.
      - name: Schema lints and generated code is in sync with api/proto
        run: make proto-check

  # markdownlint-cli2 from tools/markdownlint's lock.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # markdownlint and npm audit run on node: pinned, as every other tool is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Lint Markdown
        run: make docs-check

  # The desktop (scripts/desktop-check.sh): installed from its lock with no install
  # scripts and no Electron binary, then typecheck, lint, format, unit tests, an
  # electron-forge package with the kith-relay it bundles, a check of what the package
  # holds, and the audit of what it ships. npm's store and the Electron zip the package
  # step fetches (checked against its SHASUMS256) are cached on the lock.
  desktop:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Desktop typecheck, lint, format, tests, package and runtime audit
        run: make desktop-check

  # The single required check for branch protection.
  ci-ok:
    # always(): a skipped required check counts as passed on GitHub. release-builds is
    # not here: it runs on tags alone, and a release needs this whole workflow to pass.
    if: always()
    needs: [changes, build-and-test, test, coverage, repo-checks, release-config, lint, vuln, secrets, proto, docs, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          results="$RESULTS"
          echo "gate results: $results (docs only: $DOCS_ONLY)"
          for r in $results; do
            # A gate skips itself only for a pull request of docs alone (changes).
            if [ "$r" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then
              continue
            fi
            if [ "$r" != "success" ]; then
              echo "::error::a required gate did not pass ($results)"
              exit 1
            fi
          done
          echo "all gates green"
