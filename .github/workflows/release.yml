name: Release

on:
  push:
    tags:
      - "v*"

# Write access is granted only to the release job.
permissions:
  contents: read

# Pure-Go E2EE backend, matching CI and .goreleaser.yaml.
env:
  GOFLAGS: -tags=goolm

jobs:
  # The full CI gate set, against the tagged commit.
  verify:
    uses: ./.github/workflows/ci.yml

  # kith-signal builds and passes its own gates: a broken Signal build blocks a release
  # (merges stay unblocked; see signal.yml).
  signal:
    uses: ./.github/workflows/signal.yml

  release:
    needs: [verify, signal]
    # Protection rules (required reviewers, tag patterns) are set on the environment in
    # the repository settings; see docs/packaging.md.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release and upload its assets
      # Sigstore keyless signing and build attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog.
          persist-credentials: false

      # Only a commit already on main is released: a tag pushed on a side branch is
      # refused before anything is built or signed.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # kith-signal per Linux arch, from signal.yml's package job in this same run;
      # .goreleaser.yaml puts each beside kithd.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kith-signal-*
          path: build/signal

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No restored cache in the job that signs: what it builds comes from source.
          cache: false

      # The versions CI and `make check` use (tools/versions.env), and exactly
      # go.mod's toolchain, as the Makefile pins it. Only these names are taken.
      - name: Pinned tool versions
        run: |
          set -euo pipefail
          grep -E '^(SYFT|COSIGN)_VERSION=[0-9.]+$' tools/versions.env >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=$(awk '$1 == "toolchain" {print $2}' go.mod)" >> "$GITHUB_ENV"
          bash scripts/ensure-tools.sh goreleaser
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      # GoReleaser shells out to syft (SBOMs) and cosign (signing).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: "v${{ env.SYFT_VERSION }}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v3 signs with --bundle; see signs in .goreleaser.yaml.
          cosign-release: "v${{ env.COSIGN_VERSION }}"

      # The goreleaser `make release-check` validated with: tools/versions.env's
      # version, checked against its pinned SHA-256 by ensure-tools.
      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional publishers, skipped when unset (see docs/packaging.md).
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # kith's own Telegram app, built into kithd (see internal/telegram/app.go).
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

      # Verify with: gh attestation verify <file> --repo EugeneShtoka/kith
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.sbom.json
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
