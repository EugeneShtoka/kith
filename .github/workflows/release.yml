name: Release

on:
  push:
    tags:
      - "v*"

# Write access is granted only to the release job.
permissions:
  contents: read

# Pure-Go E2EE backend, matching CI and .goreleaser.yaml.
env:
  GOFLAGS: -tags=goolm

jobs:
  # The full CI gate set, against the tagged commit.
  verify:
    uses: ./.github/workflows/ci.yml

  # kith-signal builds and passes its own gates: a broken Signal build blocks a release
  # (merges stay unblocked; see signal.yml).
  signal:
    uses: ./.github/workflows/signal.yml

  release:
    needs: [verify, signal]
    # Protection rules (required reviewers, tag patterns) are set on the environment in
    # the repository settings; see docs/packaging.md.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release and upload its assets
      # Sigstore keyless signing and build attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog.
          persist-credentials: false

      # Only a commit already on main is released: a tag pushed on a side branch is
      # refused before anything is built or signed.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # kith-signal per Linux arch, from signal.yml's package job in this same run;
      # .goreleaser.yaml puts each beside kithd.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kith-signal-*
          path: build/signal

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No restored cache in the job that signs: what it builds comes from source.
          cache: false

      # The versions CI and `make check` use (tools/versions.env), and exactly
      # go.mod's toolchain, as the Makefile pins it. Only these names are taken.
      - name: Pinned tool versions
        run: |
          set -euo pipefail
          grep -E '^(SYFT|COSIGN)_VERSION=[0-9.]+$' tools/versions.env >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=$(awk '$1 == "toolchain" {print $2}' go.mod)" >> "$GITHUB_ENV"
          bash scripts/ensure-tools.sh goreleaser
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      # GoReleaser shells out to syft (SBOMs) and cosign (signing).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: "v${{ env.SYFT_VERSION }}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v3 signs with --bundle; see signs in .goreleaser.yaml.
          cosign-release: "v${{ env.COSIGN_VERSION }}"

      # The goreleaser `make release-check` validated with: tools/versions.env's
      # version, checked against its pinned SHA-256 by ensure-tools.
      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional publishers, skipped when unset (see docs/packaging.md).
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # kith's own Telegram app, built into kithd (see internal/telegram/app.go).
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

      # Verify with: gh attestation verify <file> --repo EugeneShtoka/kith
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.sbom.json
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst

      # The kith-relay GoReleaser just built from this commit, per arch, for the desktop
      # packages below: the relay a window runs is its tag's.
      - name: The relay the desktop bundles
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            bin=$(jq -r --arg arch "$arch" '.[] | select(.type == "Binary" and .extra.ID == "kith-relay" and .goos == "linux" and .goarch == $arch) | .path' dist/artifacts.json)
            install -D -m 0755 "$bin" "build/relay/linux_$arch/kith-relay"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kith-relay
          path: build/relay/
          retention-days: 5
          if-no-files-found: error

  # The desktop window (desktop/, docs/desktop.md): Electron Forge's deb, rpm and zip per
  # arch, made from this commit with the kith-relay above inside. This job runs npm's
  # tree, so it holds no write token: what it makes is published by desktop-publish.
  # Ubuntu 24.04 pinned, not -latest: electron-installer-redhat's spec fails under
  # rpm 4.20's build directories, and 24.04 ships rpm 4.18.
  desktop:
    needs: [release]
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/.nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kith-relay
          path: build/relay

      # Where forge.config.ts takes it from (extraResource), once it says it was built
      # from this commit at this tag: never a relay from another build.
      - name: The relay is this commit's
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          install -m 0755 "build/relay/linux_$ARCH/kith-relay" kith-relay
          ./kith-relay --version
          commit=$(./kith-relay --version | awk '$1 == "commit:" { print $2 }')
          version=$(./kith-relay --version | awk 'NR == 1 { print $2 }')
          if [ -z "$commit" ] || [ "${GITHUB_SHA#"$commit"}" = "$GITHUB_SHA" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::kith-relay is $version at $commit, not $GITHUB_REF_NAME at $GITHUB_SHA"
            exit 1
          fi

      - name: The packagers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zip unzip cpio

      # From the lock, with no install script (desktop/.npmrc); Forge fetches Electron
      # itself and checks it against its SHASUMS256. The app's version is the tag's.
      - name: Make the deb, rpm and zip
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm run make

      # Each package is unpacked and checked (scripts/desktop-package-check.sh): the relay
      # above inside, byte for byte, the fuses set, the modes. The zip is renamed as the
      # release's archives are named, and the deb by the tag: a prerelease's deb version
      # has a ~, which GitHub would rename, and the checksums would then not find it.
      - name: Check the packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p build/desktop
          for pkg in desktop/out/make/deb/*/*.deb desktop/out/make/rpm/*/*.rpm desktop/out/make/zip/linux/*/*.zip; do
            bash scripts/desktop-package-check.sh "$pkg" kith-relay
          done
          cp desktop/out/make/rpm/*/*.rpm build/desktop/
          cp desktop/out/make/deb/*/*.deb "build/desktop/kith-desktop_${GITHUB_REF_NAME#v}_$ARCH.deb"
          cp desktop/out/make/zip/linux/*/*.zip "build/desktop/kith-desktop_${GITHUB_REF_NAME#v}_linux_$ARCH.zip"
          ls -l build/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kith-desktop-linux_${{ matrix.arch }}
          path: build/desktop/
          retention-days: 5
          if-no-files-found: error

  # The desktop packages go on the tag's release with their own checksums, signed
  # keyless and attested as GoReleaser's are.
  desktop-publish:
    needs: [desktop]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload to the GitHub Release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kith-desktop-*
          path: build/desktop
          merge-multiple: true

      # A tag moved since the run began names another commit's release: refused.
      - name: The tag still names this commit
        run: |
          set -euo pipefail
          # An annotated tag's commit is its peeled ref (^{}); a lightweight tag's, the ref.
          tagged=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1)
          tagged=${tagged:-$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | cut -f1)}
          [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error::$GITHUB_REF_NAME names $tagged, not $GITHUB_SHA"; exit 1; }

      - name: Checksums
        working-directory: build/desktop
        run: |
          set -euo pipefail
          sha256sum -- * > kith-desktop_SHA256SUMS
          cat kith-desktop_SHA256SUMS

      - name: Pinned cosign version
        run: grep -E '^COSIGN_VERSION=[0-9.]+$' tools/versions.env >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v${{ env.COSIGN_VERSION }}"
      - name: Sign the checksums
        working-directory: build/desktop
        run: cosign sign-blob --bundle=kith-desktop_SHA256SUMS.sigstore.json kith-desktop_SHA256SUMS --yes

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/desktop/kith-desktop_SHA256SUMS
            build/desktop/*.deb
            build/desktop/*.rpm
            build/desktop/*.zip

      - name: Upload to the release
        working-directory: build/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ./*.deb ./*.rpm ./*.zip kith-desktop_SHA256SUMS kith-desktop_SHA256SUMS.sigstore.json
