syntax = "proto3";

package signal.v1;

option go_package = "github.com/EugeneShtoka/kith/internal/api/signal/v1;signalv1";

// SignalService is served by kith-signal, the helper that alone links libsignal (cgo),
// to kithd over a socket kithd hands it. kithd starts it, keeps it alive with
// Heartbeat, and owns everything but the helper's key store.
service SignalService {
  // Heartbeat is kithd's keep-alive: the helper exits when they stop.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Start opens the key store with kithd's key and lists the devices linked in it.
  // Once per helper.
  rpc Start(StartRequest) returns (StartResponse);
  // Link makes this helper a linked device of the phone that scans its link: a link to
  // draw as a QR code, a new one each time the last lapses, then the linked account.
  rpc Link(LinkRequest) returns (stream LinkResponse);
  // Connect connects a linked account: its events start coming on Events.
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  // Events is every connected account's events, for one listener (a new call takes
  // over). An event with a token waits in the helper until Ack: Signal is told it
  // arrived only then, so one kithd never kept is sent again. A new listener is sent
  // every event still waiting first.
  rpc Events(EventsRequest) returns (stream EventsResponse);
  // Ack says kithd has kept the event with token.
  rpc Ack(AckRequest) returns (AckResponse);
  // Send sends a message from a connected account.
  rpc Send(SendRequest) returns (SendResponse);
  // Typing says a connected account is typing in a chat, or stopped.
  rpc Typing(TypingRequest) returns (TypingResponse);
  // MarkRead tells the account's other devices (the phone), and with receipts the
  // messages' authors, that it read messages.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  // Download fetches an attachment from Signal's CDN and decrypts it.
  rpc Download(DownloadRequest) returns (DownloadResponse);
  // Upload encrypts a file and puts it on Signal's CDN, for a Send to carry.
  rpc Upload(UploadRequest) returns (UploadResponse);
  // Unlink removes a linked device: Signal is told (when it is connected), and its keys
  // are deleted from the store.
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
  // Leave takes a connected account out of a group; its other members are told.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
}

message HeartbeatRequest {}

message HeartbeatResponse {}

message StartRequest {
  // The key store's key, from kithd's keyring.
  bytes key = 1;
}

message StartResponse {
  repeated Device devices = 1;
}

// Device is a Signal account this helper is linked to as a secondary device.
message Device {
  // The account's ACI, Signal's own ID for it (a UUID).
  string aci = 1;
  // The account's phone number, E.164.
  string number = 2;
}

message LinkRequest {
  // The name the phone lists this device under.
  string device_name = 1;
}

message LinkResponse {
  oneof step {
    // An sgnl://linkdevice link to draw as a QR code; it lapses after about a minute.
    string url = 1;
    // The phone scanned it: the account this helper is now linked to.
    Device linked = 2;
  }
}

message ConnectRequest {
  // The linked account's ACI.
  string aci = 1;
}

message ConnectResponse {}

message EventsRequest {}

message EventsResponse {
  // Ack it once kept; 0 for an event that waits for nothing (a connection's state).
  uint64 token = 1;
  // The account (its ACI) the event is for.
  string account = 2;
  oneof event {
    Message message = 3;
    Connection connection = 4;
    Contacts contacts = 5;
    Group group = 6;
    Edit edit = 7;
    Delete delete = 8;
    Reaction reaction = 9;
    Receipt receipt = 10;
    Typing typing = 11;
    Read read = 12;
    Timer timer = 13;
    History history = 14;
  }
}

// History is part of a chat's history, from the archive the phone transfers when this
// device is linked: history, not news. A chat's history may come in several parts.
message History {
  string chat = 1;
  bool group = 2;
  // Oldest first.
  repeated Message messages = 3;
  // The sent time (ms) of the newest message the account had read, 0 for none.
  uint64 read_through = 4;
  // The chat's disappearing-messages timer (s) and its number (see Timer).
  uint32 timer = 5;
  uint32 timer_version = 6;
}

// Timer is a chat's disappearing-messages timer changed, by someone in it or on another
// of the account's devices.
message Timer {
  string chat = 1;
  bool group = 2;
  string sender = 3;
  // The timer in seconds; 0 turns it off.
  uint32 seconds = 4;
  // For a one-to-one chat, the change's number: Signal counts them, and an older one
  // does not undo a newer. 0 when the sender's app numbers none.
  uint32 version = 5;
}

// Edit replaces a message's text.
message Edit {
  string chat = 1;
  bool group = 2;
  string sender = 3;
  // The edited message's sent time: its ID, whatever edits came since.
  uint64 target = 4;
  // This edit's own sent time (a reaction to the edited message names it).
  uint64 sent = 5;
  string body = 6;
  repeated Mention mentions = 7;
}

// Delete deletes a message for everyone.
message Delete {
  string chat = 1;
  bool group = 2;
  string sender = 3;
  // The deleted message's sent time.
  uint64 target = 4;
  // When it was deleted (ms).
  uint64 sent = 5;
}

// Reaction is an emoji put on a message, or taken off it.
message Reaction {
  string chat = 1;
  bool group = 2;
  string sender = 3;
  string emoji = 4;
  bool remove = 5;
  // The message reacted to: its author, and the sent time of its latest version (an
  // edit's, if it was edited).
  string target_author = 6;
  uint64 target_sent = 7;
  string sender_name = 8;
}

// Receipt is someone having got, read or viewed the account's messages.
message Receipt {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DELIVERED = 1;
    KIND_READ = 2;
    KIND_VIEWED = 3;
  }
  string sender = 1;
  Kind kind = 2;
  // The account's messages', by sent time.
  repeated uint64 sent = 3;
}

// Typing is someone typing in a chat, or stopping.
message Typing {
  string chat = 1;
  bool group = 2;
  string sender = 3;
  bool started = 4;
}

// Read is messages read on another of the account's devices.
message Read {
  repeated ReadMessage messages = 1;
}

message ReadMessage {
  string author = 1;
  uint64 sent = 2;
}

// Message is a message in a chat: someone else's, or the account's own (sent from
// another of its devices).
message Message {
  // The chat: the other side's ACI, or the group's ID (std base64, as Signal has it).
  string chat = 1;
  bool group = 2;
  // The author's ACI, and when they sent it (ms): together the message's ID.
  string sender = 3;
  uint64 sent = 4;
  // When Signal's server took it (ms).
  uint64 received = 5;
  string body = 6;
  // The author's name as the account knows it (contact name, else profile name).
  string sender_name = 7;
  // For a one-to-one chat, the other side's name.
  string chat_name = 8;
  Quote quote = 9;
  repeated Mention mentions = 10;
  repeated Attachment attachments = 11;
  // The author's and, for a one-to-one chat, the other side's phone numbers (E.164),
  // when the account knows them: what joins them to the same people elsewhere.
  string sender_number = 12;
  string chat_number = 13;
  // The chat's disappearing-messages timer (s) as the message was sent with it, 0 for
  // none, and for a one-to-one chat the number of the change that set it (see Timer).
  uint32 timer = 14;
  uint32 timer_version = 15;
  // When the message's own countdown started (ms), for an archived one whose countdown
  // the phone had started; 0 otherwise (it starts when sent, or when read).
  uint64 timer_started = 16;
}

// Quote is the message a message replies to.
message Quote {
  string author = 1;
  uint64 sent = 2;
  string text = 3;
}

// Mention is a person mentioned in a body: Signal puts U+FFFC in the text there.
message Mention {
  // In UTF-16 code units, as Signal counts.
  uint32 start = 1;
  uint32 length = 2;
  string aci = 3;
  string name = 4;
}

// Attachment is a file a message carries, still on Signal's CDN.
message Attachment {
  string content_type = 1;
  string file_name = 2;
  uint64 size = 3;
  // Signal's AttachmentPointer, serialized: what fetching it takes.
  bytes pointer = 4;
  // The file's hash, for an archived attachment whose pointer has no digest to check.
  bytes plaintext_hash = 5;
}

// Connection is an account's connection to Signal.
message Connection {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_CONNECTED = 1;
    STATE_DISCONNECTED = 2;
    // The phone unlinked this device.
    STATE_LOGGED_OUT = 3;
  }
  State state = 1;
  string detail = 2;
}

// Contacts is the phone's contact list, as it syncs it.
message Contacts {
  repeated Contact contacts = 1;
}

message Contact {
  string aci = 1;
  string name = 2;
  string number = 3;
}

// Group is a group as Signal describes it, sent before the first of its messages.
message Group {
  string id = 1;
  string title = 2;
  // Its members' ACIs.
  repeated string members = 3;
  // Its disappearing-messages timer (s), 0 for none.
  uint32 timer = 4;
}

message AckRequest {
  uint64 token = 1;
}

message AckResponse {}

message SendRequest {
  // The connected account's ACI.
  string account = 1;
  // The chat, as Message has it: the other side's ACI, or the group's ID.
  string chat = 2;
  bool group = 3;
  string body = 4;
  // The message's sent time (ms), kithd's to choose: with the account, its ID. A send
  // repeated with the same time is the same message to Signal's clients.
  uint64 sent = 5;
  // The message replied to, if any.
  Quote quote = 6;
  // Instead of a new message, at most one of: an edit of the account's message (the
  // sent time of its latest version, which is what an edit names), a reaction (its
  // target the latest version too), or a deletion for everyone of the account's
  // message (by its original sent time).
  uint64 edit_of = 7;
  Reaction reaction = 8;
  uint64 delete_of = 9;
  // A new message's disappearing-messages timer (s): the chat's, which every message
  // there must carry, or it does not disappear. For a one-to-one chat, the number of
  // the change that set it (see Timer).
  uint32 timer = 10;
  uint32 timer_version = 11;
  // Files a new message carries, each as Upload returned it; body is then their caption.
  repeated Attachment attachments = 12;
  // People the body (or an edit's) mentions, each where it has U+FFFC.
  repeated Mention mentions = 13;
}

message DownloadRequest {
  // An attachment's pointer, as a Message (or Upload) had it, and its plaintext hash
  // when it came with one.
  bytes pointer = 1;
  bytes plaintext_hash = 2;
}

message DownloadResponse {
  bytes data = 1;
}

message UploadRequest {
  // The connected account's ACI: its connection uploads.
  string account = 1;
  bytes data = 2;
  string content_type = 3;
  string file_name = 4;
  // A picture's size in pixels, 0 when unknown.
  uint32 width = 5;
  uint32 height = 6;
}

message UnlinkRequest {
  // The linked account's ACI.
  string account = 1;
}

message UnlinkResponse {}

message LeaveRequest {
  // The connected account's ACI.
  string account = 1;
  // The group's ID, as a Message's chat names it.
  string group = 2;
}

message LeaveResponse {}

message UploadResponse {
  // The file as a Send carries it.
  Attachment attachment = 1;
}

message SendResponse {}

message TypingRequest {
  string account = 1;
  string chat = 2;
  bool group = 3;
  bool typing = 4;
}

message TypingResponse {}

message MarkReadRequest {
  string account = 1;
  // The messages read, by author and sent time.
  repeated ReadMessage messages = 2;
  // Whether the authors are told too (read receipts), not only the account's devices.
  bool receipts = 3;
}

message MarkReadResponse {}
