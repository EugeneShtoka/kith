syntax = "proto3";

package device.v1;

option go_package = "github.com/EugeneShtoka/kith/internal/api/device/v1;devicev1";

// DeviceService is served by kith-relay, the desktop window's link to kithd, beside the
// BackendService it forwards: what this device is, which only the relay knows.
service DeviceService {
  // Device is where this device's requests go, the profiles the config defines, and
  // the one this device last ran in. Each call reads the files again, so a window asks
  // after a config change (ConfigChanged). On a device that joined a bridge the config
  // is the bridge's, read through it: kithd unreachable is UNAVAILABLE, and the bridge
  // refusing this device's key PERMISSION_DENIED.
  rpc Device(DeviceRequest) returns (DeviceResponse);
  // ChooseProfile remembers a profile as the one this device runs in (device.toml's
  // profile_in_use), refusing a name the config lacks (INVALID_ARGUMENT).
  rpc ChooseProfile(ChooseProfileRequest) returns (ChooseProfileResponse);
  // DeviceSettings is what the window reads of this device's settings (device.toml),
  // each key's default applied. Each call reads the file again.
  rpc DeviceSettings(DeviceSettingsRequest) returns (DeviceSettingsResponse);
  // UpdateDeviceSettings writes the window's settings to the device file if the file is
  // still the one read at base_revision (DeviceSettings' revision). Changed since, by
  // hand or by another window, it is ABORTED and nothing is written: the window reads it
  // again. Each key whose value differs from the file's (resolved) is written, by the
  // writer the TUI's settings editor uses; every other is left as the file has it. A
  // value the TUI would refuse is INVALID_ARGUMENT, a file that does not load
  // FAILED_PRECONDITION. It answers the settings as now resolved, and their revision.
  rpc UpdateDeviceSettings(UpdateDeviceSettingsRequest) returns (UpdateDeviceSettingsResponse);
  // Outgoing readies a file on this device for sending, as the TUI readies one: where
  // [display.media] anonymize holds, a picture is copied without its metadata
  // (media.Strip) and the file goes under a neutral name (domain.SentName). Main asks
  // it for each file the person offered; the window never names a path.
  rpc Outgoing(OutgoingRequest) returns (OutgoingResponse);
  // Theme is the graphical clients' theme ([gui.theme]) as it now resolves: each key from
  // this device's file (device.toml) where it sets one, else from the bridge's config
  // (config.toml, read through kithd's GetConfig on any device), else its default; and
  // what the defaults come from, so the window draws as the TUI does until a color is
  // picked. Each call reads both again: a window asks after a config change
  // (ConfigChanged). kithd unreachable is UNAVAILABLE; a [gui.theme] that does not check,
  // in either file, FAILED_PRECONDITION.
  rpc Theme(ThemeRequest) returns (ThemeResponse);
  // UpdateTheme writes theme keys, each to the scope it names: SHARED into the bridge's
  // config, written whole through kithd (UpdateConfig) on config_revision, never into a
  // file here; DEVICE into device.toml on device_revision, as UpdateDeviceSettings
  // writes it. An empty value removes the key from that scope's file. A file changed
  // since its revision is ABORTED with nothing of that scope written: the window reads
  // the theme again. An unknown key, a color that is not #rrggbb or a mode not known is
  // INVALID_ARGUMENT, nothing written. It answers the theme as now resolved.
  rpc UpdateTheme(UpdateThemeRequest) returns (UpdateThemeResponse);
}

message ThemeRequest {}

message ThemeResponse {
  // values holds each key by its path in [gui.theme]: "mode"; "light.<role>" and
  // "dark.<role>" for each role (accent, background, surface, text, muted, link,
  // selection, unread, mention); "accounts.<account>" for each account kithd serves or
  // either file names; "people.<person>" for each person either file names.
  map<string, ThemeValue> values = 1;
  // config_revision is config.toml's as GetConfig read it, device_revision device.toml's
  // ("" for no file): what UpdateTheme's writes are made on.
  string config_revision = 2;
  string device_revision = 3;
  // accounts are the network accounts kithd serves, as Accounts lists them: the key
  // ("accounts." + on) each color is kept under, and what to call it.
  repeated ThemeAccount accounts = 4;
  // sender_palette is the TUI's sender colors ("#rrggbb"), a room's color slot i being
  // its i-th (SenderSlots); the colors pinned to [[display.identity]] are avoided.
  repeated string sender_palette = 5;
  // network_colors is each network's color as the TUI names its rooms in it
  // ([tui.theme.networks], its default where unset), by the network as a Room
  // names it ("WhatsApp"); a network with no color is absent.
  map<string, string> network_colors = 6;
  // identities is each person a [[display.identity]] names, by ID: the key a room's
  // color slots remember them by, and the color pinned to them, if any.
  map<string, ThemeIdentity> identities = 7;
}

// ThemeSource is where a key's value comes from.
enum ThemeSource {
  THEME_SOURCE_UNSPECIFIED = 0; // its default: no file sets it
  THEME_SOURCE_SHARED = 1; // the bridge's config.toml
  THEME_SOURCE_DEVICE = 2; // this device's device.toml, over the shared one
}

// ThemeValue is one key: what it is, from where, and what each file holds of it.
message ThemeValue {
  // value is the effective one: device's, else shared's, else the default ("" for a
  // role, the built-in token; for a person, their slot's color; for an account, its
  // network's color, if any).
  string value = 1;
  ThemeSource source = 2;
  // shared and device are what each file holds of the key, "" where it is unset.
  string shared = 3;
  string device = 4;
}

// ThemeAccount is one network account kithd serves.
message ThemeAccount {
  // on is its rooms' owner, as domain.AccountRooms writes it: a room is the account's
  // when its ID starts with it.
  string on = 1;
  string network = 2;
  // name is what the config calls it (Matrix: the MXID).
  string name = 3;
}

// ThemeIdentity is a person as their [[display.identity]] colors them.
message ThemeIdentity {
  // key is what a room's color slots (SenderSlots) remember them by.
  string key = 1;
  // color is the identity's pinned color ("#rrggbb"), "" for none.
  string color = 2;
}

// ThemeScope is where a write goes.
enum ThemeScope {
  THEME_SCOPE_UNSPECIFIED = 0; // refused
  THEME_SCOPE_SHARED = 1; // the bridge's config.toml, every device
  THEME_SCOPE_DEVICE = 2; // this device's device.toml
}

message ThemeWrite {
  // key is a path in [gui.theme], as ThemeResponse.values names it.
  string key = 1;
  // value is the key's new value; "" removes it from scope's file.
  string value = 2;
  ThemeScope scope = 3;
}

message UpdateThemeRequest {
  // config_revision and device_revision are the theme's (ThemeResponse) the writes were
  // made on.
  string config_revision = 1;
  string device_revision = 2;
  repeated ThemeWrite writes = 3;
}

message UpdateThemeResponse {
  ThemeResponse theme = 1;
}

message OutgoingRequest {
  // path is the file the person picked, dropped or pasted, on this device.
  string path = 1;
}

message OutgoingResponse {
  // path is what to send: a clean copy, or the file itself when it needs none.
  string path = 1;
  // name is what the file is sent as; empty sends it under its own.
  string name = 2;
  // copied: path is a copy in a folder of its own, which main removes once sent.
  bool copied = 3;
  // kept: a picture whose metadata kith cannot remove (HEIC), sent as it is.
  bool kept = 4;
}

message DeviceRequest {}

message DeviceResponse {
  // socket is the local kithd's socket, which the relay forwards BackendService to; ""
  // on a device that joined a bridge (bridge).
  string socket = 1;
  // profile is the [[profile]] this device last ran in, as the config spells it; ""
  // when none was ever chosen, or the config no longer has it. With one profile a
  // window runs in it unasked; with several and none here, it asks.
  string profile = 2;
  // profiles are the names of the config's [[profile]]s, in its order.
  repeated string profiles = 3;
  // bridge is the name of the [[bridge]] this device joined (device.toml), which the relay
  // forwards BackendService to over TLS, and whose config the profiles are; "" for the
  // local kithd at socket.
  string bridge = 4;
}

message ChooseProfileRequest {
  // name is a profile's name, in any case.
  string name = 1;
}

message ChooseProfileResponse {
  // profile is the profile now remembered, as the config spells it.
  string profile = 1;
}

message DeviceSettingsRequest {}

message DeviceSettingsResponse {
  DeviceSettings settings = 1;
  // revision is the device file's as settings were read from it: a hash of its bytes,
  // "" for no file.
  string revision = 2;
}

message UpdateDeviceSettingsRequest {
  // base_revision is the revision the settings changed were read at.
  string base_revision = 1;
  DeviceSettings settings = 2;
}

message UpdateDeviceSettingsResponse {
  DeviceSettings settings = 1;
  // revision is the device file's as now written.
  string revision = 2;
}

// DeviceSettings is what the window reads of this device's settings (device.toml), each
// key's default applied.
message DeviceSettings {
  // [display] send_receipts: whether the people in a room are told how far you have
  // read; without, the receipt is private and only your own clients see it.
  bool send_receipts = 1;
  // [[display.read_rule]], in the file's order: the narrowest naming a room or a
  // message's sender says otherwise there (ties: the later).
  repeated ReadRule read_rules = 2;
  // [display] unread_line: a rule drawn where a room's unread messages began when it
  // was opened.
  bool unread_line = 3;
  // [composer] markdown: a message is sent with its Markdown rendered.
  bool markdown = 4;
  // [composer] confirm_sms: a message or file to a chat that sends as SMS asks first.
  bool confirm_sms = 5;
  // [display] send_typing: rooms are told while you type.
  bool send_typing = 6;
  // [display] skin_tone, as the modifier that applies it; "" for none.
  string skin_tone = 7;
  // [display.emoji]: the set offered ("curated", "standard" or "complete"), and the
  // shortcodes added to it.
  string emoji_set = 8;
  map<string, string> emoji_extra = 9;
  // [display.reactions]: how the quick palette is ranked ("room", "space", "global" or
  // "static"), and the emoji it starts from; none set is the built-in ones.
  string reactions_scope = 10;
  repeated string reactions_static = 11;
}

// ReadRule is one [[display.read_rule]], less its delay: the window reads a room by
// opening it, so how long a cursor rests on one is the TUI's.
message ReadRule {
  // A room ID, or a home entry (space:, tag:, place:); empty with a sender.
  string match = 1;
  // A message author's ID; empty is anyone.
  string sender = 2;
  // Whether receipts are announced there; unset inherits.
  optional bool send = 3;
}
