            - "github.com/EugeneShtoka/kith/internal/filedialog"
            - "github.com/godbus/dbus/v5"

        media-knows-only-domain:
          files:
            - "**/internal/media/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/media"

        # The binaries. kith reaches matrix/session/spell/llamacpp only for login and
        # installers, which run before a daemon exists.
        client-main-wiring:
          files:
            - "**/cmd/kith/**"
            # Tests stub the keyring (go-keyring's mock), as kithd's do.
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/agent"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/buildinfo"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/daemon"
            - "github.com/EugeneShtoka/kith/internal/devicekey"
            - "github.com/EugeneShtoka/kith/internal/domain"
            # kith mesh says how long ago a bridge was heard.
            - "github.com/EugeneShtoka/kith/internal/human"
            - "github.com/EugeneShtoka/kith/internal/keystore"
            - "github.com/EugeneShtoka/kith/internal/launch"
            - "github.com/EugeneShtoka/kith/internal/llamacpp"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/matrix"
            - "github.com/EugeneShtoka/kith/internal/pairing"
            - "github.com/EugeneShtoka/kith/internal/qrtext"
            - "github.com/EugeneShtoka/kith/internal/session"
            - "github.com/EugeneShtoka/kith/internal/setup"
            - "github.com/EugeneShtoka/kith/internal/spell"
            - "github.com/EugeneShtoka/kith/internal/tui"
            - "github.com/adrg/xdg"
            - "golang.org/x/term"

        daemon-main-wiring:
          files:
            - "**/cmd/kithd/**"
            # Tests stub the keyring (go-keyring's mock), as the session package's do.
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/backup"
            - "github.com/EugeneShtoka/kith/internal/buildinfo"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/daemon"
            - "github.com/EugeneShtoka/kith/internal/devicekey"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/gmessages"
            - "github.com/EugeneShtoka/kith/internal/instagram"
            - "github.com/EugeneShtoka/kith/internal/keystore"
            - "github.com/EugeneShtoka/kith/internal/linkedin"
            - "github.com/EugeneShtoka/kith/internal/local"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/matrix"
            - "github.com/EugeneShtoka/kith/internal/mesh"
            - "github.com/EugeneShtoka/kith/internal/meta"
            - "github.com/EugeneShtoka/kith/internal/modelsetup"
            - "github.com/EugeneShtoka/kith/internal/route"
            - "github.com/EugeneShtoka/kith/internal/schedule"
            - "github.com/EugeneShtoka/kith/internal/session"
            - "github.com/EugeneShtoka/kith/internal/setup"
            - "github.com/EugeneShtoka/kith/internal/signal"
            - "github.com/EugeneShtoka/kith/internal/slack"
            - "github.com/EugeneShtoka/kith/internal/telegram"
            - "github.com/EugeneShtoka/kith/internal/whatsapp"
            - "github.com/adrg/xdg"
            - "golang.org/x/term"
          deny:
