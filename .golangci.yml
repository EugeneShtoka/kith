            - "github.com/charmbracelet/x/ansi"
            - "github.com/rivo/uniseg"
            - "golang.org/x/term"

        # Allow list: new infrastructure deps must be written down here.
        tui-no-infra:
          files:
            - "**/internal/tui/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/apitest"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/setup"
            - "github.com/EugeneShtoka/kith/internal/audio"
            - "github.com/EugeneShtoka/kith/internal/cmdtemplates"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/emoji"
            - "github.com/EugeneShtoka/kith/internal/filedialog"
            - "github.com/EugeneShtoka/kith/internal/focus"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/human"
            - "github.com/EugeneShtoka/kith/internal/media"
            - "github.com/EugeneShtoka/kith/internal/notify"
            - "github.com/EugeneShtoka/kith/internal/phonebook"
            - "github.com/EugeneShtoka/kith/internal/qrtext"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/EugeneShtoka/kith/internal/theme"
            - "github.com/EugeneShtoka/kith/internal/tui"
            - "charm.land/bubbletea/v2"
            - "charm.land/lipgloss/v2"
            - "github.com/charmbracelet/x/ansi"
            - "github.com/rivo/uniseg"
            - "golang.org/x/image"
            - "golang.org/x/term"
            - "golang.org/x/text"

    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (io.Closer).Close
        # Not (*os.File).Close: closing a file written to reports whether the write
        # landed, so every one is checked (or discarded by name, with the reason).

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam          # bubbletea models are legitimately large value types

    wrapcheck:
      # Scan errors are wrapped by the caller. Setting this replaces the defaults.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - .Scan(
        # A login's talk fails only when the login ends (canceled, or timed out):
        # its error is the context's, and every network's login hands it back as is.
        - api.LoginTalk).
        - .NumberedAccount(
        - .AskName(
      # setup's errors already name the config section at fault.
      ignore-package-globs:
        - github.com/EugeneShtoka/kith/internal/setup
        # keystore's are session's own, moved beneath it: sentinels (a keyring not
        # answering) and file errors that name the file, shown as they are.
        - github.com/EugeneShtoka/kith/internal/keystore

    misspell:
      locale: US

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    gosec:
      excludes:
        - G104  # unhandled errors: covered by errcheck exclusions (Close/Rollback)

    funlen:
      # Code lines only; comments are not counted.
      ignore-comments: true
      lines: 60        # 60 lines of code
      statements: 40   # or 40 statements, whichever comes first

    gocognit:
      # richtext.Sanitize carries the one nolint.
      min-complexity: 25

  exclusions:
    rules:
      - path-except: "internal/tui/"
        linters:
          - forbidigo
      - path: "internal/tui/text(_bidi)?\\.go|_test\\.go"
        linters:
          - forbidigo
      - path: "_test\\.go"
        linters:
          - unused
          - gosec
          - wrapcheck
          - funlen
          - gocognit
          - containedctx
          # A test helper keeps a parameter every caller passes alike when naming it at
          # the call site says what the test is about.
          - unparam
      # The router forwards an adapter's own error, which already names its network;
      # wrapping each would only repeat the call.
      - path: "internal/route/"
        linters:
          - wrapcheck
      # Every TUI handler returns (Model, tea.Cmd), so route dispatches them alike; one
      # that has no command yet answers nil rather than a different shape.
      - linters: [unparam]
        text: "result 1 \\(charm\\.land/bubbletea/v2\\.Cmd\\) is always nil"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
