            - "github.com/EugeneShtoka/kith/internal/api/device/v1"
            # The rail's room facts and the messages a user command is given, as domain values.
            - "github.com/EugeneShtoka/kith/internal/api/backend/v1/protoconv"
            - "github.com/EugeneShtoka/kith/internal/buildinfo"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/daemon"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/human"
            # This machine's device key, to dial a bridge elsewhere; user commands' secrets.
            - "github.com/EugeneShtoka/kith/internal/keystore"
            # Joining a bridge as kith join does: the pairing URI, the device IDs.
            - "github.com/EugeneShtoka/kith/internal/devicekey"
            - "github.com/EugeneShtoka/kith/internal/pairing"
            - "google.golang.org/protobuf/types/known/timestamppb"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/media"
            - "github.com/EugeneShtoka/kith/internal/setup"
            # The TUI's sender colors as data, which the window draws by (no lipgloss).
            - "github.com/EugeneShtoka/kith/internal/themespec"
            # A login's QR step encoded as the TUI's qrtext encodes it, for the window to draw.
            - "rsc.io/qr"

        # The Signal helper's main: the helper and, built with the signal tag, Signal.
        signal-main-wiring:
