version: "2"

run:
  # Lint the cgo-free goolm build (see Makefile GOFLAGS).
  build-tags:
    - goolm

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - depguard       # enforce layer boundaries (see rules below)
    - govet          # shadow + copylocks + printf consistency
    - staticcheck    # industry-leading bug + performance checker
    - errcheck       # every error must be handled
    - nilerr         # don't return nil when wrapping a non-nil error
    - noctx          # http requests must carry a context
    - errorlint
    - sqlclosecheck
    - rowserrcheck
    - wrapcheck      # errors from external packages must be wrapped with context
    - gocritic       # diagnostic + style + performance
    - unconvert      # remove redundant type conversions
    - misspell       # catch common typos in comments and strings
    - unused         # dead code detection
    - bodyclose      # HTTP response bodies must be closed
    - ineffassign    # detect ineffective assignments
    - gosec          # security checks (excluded rules listed below)
    - funlen
    - gocognit
    - containedctx   # a context held in a struct must be a decision, not a habit
    - nolintlint     # every suppression names its linter and says why
    - exhaustive     # a switch over an enum names every value, or says why not
    - forbidigo
    - bidichk        # no invisible direction controls in source: this client draws RTL text
    - protogetter    # read wire messages through their nil-safe getters
    - usestdlibvars  # http.MethodGet, not "GET"
    - modernize      # the current idiom (range over int, slices/maps helpers, new(expr))
    - unparam        # a parameter every caller passes the same value, or a result nobody reads
    - sloglint       # slog calls: key/value pairs consistent, keys in one style
    - durationcheck  # two durations multiplied (a unit error)
    - errchkjson     # a json encode error that can happen is checked
    - usetesting     # t.TempDir / t.Context / t.Setenv over the os and context versions
    # Considered and left off: contextcheck flags the deliberately detached contexts
    # (the scheduler's base, a spawned daemon), and nilnil the "found nothing" (nil, nil)
    # returns that are the documented contract of their functions.

  settings:
    exhaustive:
      default-signifies-exhaustive: true
      # Third-party enums, and tui.action, which each pane handles only in part by design.
      ignore-enum-types: "reflect\\.Kind|html\\.TokenType|event\\.MessageType|tui\\.action"
    # internal/tui/text.go is the one text pipeline (wrap/cut -> bidi -> style); its
    # primitives are forbidden elsewhere in internal/tui (see exclusions).
    forbidigo:
      forbid:
        - pattern: '^ansi\.(Wrap|Wordwrap|Hardwrap|Truncate|TruncateLeft)$'
          msg: "cut or wrap text with drawLine / drawBlock (or truncateLogical / truncateDrawn) in internal/tui/text.go — a cut made outside it happens in the wrong order for right-to-left text"
        - pattern: '^(reorder|reorderMapped|visualOrder|styledRow|bidiRuns)$'
          msg: "draw text with drawLine / drawBlock / drawFragment in internal/tui/text.go instead of reordering by hand — callers pass logical text"
        - pattern: '^bidi\.(AppendReverse|ReverseString|Paragraph)$'
          msg: "bidi reordering lives in internal/tui/text_bidi.go; draw text with drawLine / drawBlock"
    govet:
      enable:
        - shadow     # catch variable shadowing — footgun in bubbletea update loops
        - copylocks  # detect mutex copied by value

    depguard:
      rules:
        # The foundation packages, each an allow-list of exactly what it may import: a
        # deny-list only names what it thought of (theme once pulled lipgloss into the
        # daemon through setup), where an allow-list cannot fall behind.
        buildinfo-is-standalone:
          files:
            - "**/internal/buildinfo/**"
          allow:
            - "$gostd"
        config-is-standalone:
          files:
            - "**/internal/config/**"
          allow:
            - "$gostd"
            - "github.com/BurntSushi/toml"
            - "github.com/adrg/xdg"
            # The device file's lock, which every writer of it holds.
            - "github.com/gofrs/flock"
        # The theme as data, for every binary's config check: nothing that renders.
        themespec-is-standalone:
          files:
            - "**/internal/themespec/**"
          allow:
            - "$gostd"
        # The theme as styles, for the TUI alone (deps-check keeps it out of the rest).
        theme-draws:
          files:
            - "**/internal/theme/**"
          allow:
            - "$gostd"
            - "charm.land/lipgloss/v2"
            - "github.com/charmbracelet/x/ansi"
            - "github.com/EugeneShtoka/kith/internal/themespec"

        # Pure: the standard library, its own sanitizer and grapheme segmentation.
        domain-is-pure:
          files:
            - "**/internal/domain/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/rivo/uniseg"

        # The wire. Clients link it, so what it links reaches kith and kith-mcp: never
        # the cache, the Matrix SDK or the model processes.
        daemon-is-the-wire:
          files:
            - "**/internal/daemon/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/daemon"
            # The remote listener pins device keys; the roster is a TOML file.
            - "github.com/EugeneShtoka/kith/internal/devicekey"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/notify"
            # Pairing tokens and their digits.
            - "github.com/EugeneShtoka/kith/internal/pairing"
            # The profiles' people.exclude reads the phonebook's cards (ProfilePeople).
            - "github.com/EugeneShtoka/kith/internal/phonebook"
            - "github.com/EugeneShtoka/kith/internal/setup"
            - "github.com/EugeneShtoka/kith/internal/human"
            - "connectrpc.com/connect"
            - "github.com/BurntSushi/toml"
            - "github.com/adrg/xdg"
            - "github.com/fsnotify/fsnotify"
            - "github.com/gofrs/flock"
            - "google.golang.org/protobuf"

        # The cache: SQLite, encrypted (sealeddb, with FTS5 from ncruces), and the domain
        # types it stores (formatting as richtext markup).
        db-is-the-cache:
          files:
            - "**/internal/db/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/EugeneShtoka/kith/internal/sealeddb"
            - "github.com/adrg/xdg"
            - "github.com/ncruces/go-sqlite3"

        # The Matrix adapter: its session, login and sync. Only the daemon links it.
        matrix-is-the-adapter:
          files:
            - "**/internal/matrix/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/markdown"
            - "github.com/EugeneShtoka/kith/internal/matrix"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/EugeneShtoka/kith/internal/session"
            - "github.com/rs/zerolog"
            - "go.mau.fi/util"
            - "golang.org/x/image"
            - "maunium.net/go/mautrix"
            - "modernc.org/sqlite"

        # What the daemon answers from its own stores, whatever the network: the cache,
        # spelling, word completion and the language models. No chat network's SDK.
        local-is-the-cache-service:
          files:
            - "**/internal/local/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/llamacpp"
            - "github.com/EugeneShtoka/kith/internal/llm"
            - "github.com/EugeneShtoka/kith/internal/local"
            - "github.com/EugeneShtoka/kith/internal/spell"
            - "github.com/EugeneShtoka/kith/internal/vocab"
            - "github.com/adrg/xdg"

        # The networks served as one: knows the adapters only by interface, so it
        # never links a network's SDK.
        route-is-the-switch:
          files:
            - "**/internal/route/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/route"

        # The WhatsApp adapter: the only package that imports whatsmeow. Only the daemon
        # links it.
        whatsapp-is-the-adapter:
          files:
            - "**/internal/whatsapp/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/expiry"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "github.com/EugeneShtoka/kith/internal/sealeddb"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/EugeneShtoka/kith/internal/whatsapp"
            - "go.mau.fi/libsignal"
            - "go.mau.fi/whatsmeow"
            - "golang.org/x/image"
            - "google.golang.org/protobuf"
            - "modernc.org/sqlite"

        # The Telegram adapter: the only package that imports gotd. Only the daemon
        # links it; its credentials reach it through an interface the daemon backs
        # with the keyring, and its updates position lives in a store of its own.
        telegram-is-the-adapter:
          files:
            - "**/internal/telegram/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "github.com/EugeneShtoka/kith/internal/markdown"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/EugeneShtoka/kith/internal/telegram"
            - "github.com/EugeneShtoka/kith/internal/human"
            - "github.com/gotd/log"
            - "github.com/gotd/td"
            - "modernc.org/sqlite"

        # The Slack adapter: the only package that imports slack-go (Beeper's fork, see
        # go.mod). Only the daemon links it; its credentials reach it through an
        # interface the daemon backs with the keyring.
        slack-is-the-adapter:
          files:
            - "**/internal/slack/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "github.com/EugeneShtoka/kith/internal/emoji"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/EugeneShtoka/kith/internal/slack"
            - "github.com/slack-go/slack"

        # The Messenger adapter: the only package that imports mautrix-meta's messagix
        # (and, through its login steps, mautrix's bridgev2 types). Its encrypted chats
        # run on whatsmeow, over a store file of its own. Only the daemon links it; its
        # sessions reach it through an interface the daemon backs with the keyring.
        meta-is-the-adapter:
          files:
            - "**/internal/meta/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "github.com/EugeneShtoka/kith/internal/sealeddb"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/human"
            - "github.com/EugeneShtoka/kith/internal/meta"
            - "github.com/rs/zerolog"
            - "go.mau.fi/mautrix-meta/pkg/messagix"
            - "go.mau.fi/util/exhttp"
            - "go.mau.fi/whatsmeow"
            - "maunium.net/go/mautrix/bridgev2"
            - "modernc.org/sqlite"

        # The Instagram adapter: the only package that imports mautrix-meta's instameow.
        # Only the daemon links it; its sessions reach it through an interface the daemon
        # backs with the keyring.
        instagram-is-the-adapter:
          files:
            - "**/internal/instagram/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/rs/zerolog"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "go.mau.fi/mautrix-meta/pkg/instameow"
            - "go.mau.fi/mautrix-meta/pkg/messagix/cookies"
            - "go.mau.fi/mautrix-meta/pkg/messagix/dgw"
            - "go.mau.fi/mautrix-meta/pkg/messagix/httpclient"
            - "go.mau.fi/mautrix-meta/pkg/messagix/methods"
            - "go.mau.fi/mautrix-meta/pkg/messagix/types"
            - "go.mau.fi/mautrix-meta/pkg/messagix/useragent"
            - "go.mau.fi/util/exhttp"

        # The Google Messages adapter: the only package that imports mautrix-gmessages'
        # libgm. Only the daemon links it; its sessions reach it through an interface
        # the daemon backs with the keyring.
        gmessages-is-the-adapter:
          files:
            - "**/internal/gmessages/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "github.com/EugeneShtoka/kith/internal/gmessages"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/rs/zerolog"
            - "go.mau.fi/mautrix-gmessages/pkg/libgm"
            - "go.mau.fi/util/exhttp"
            - "github.com/google/uuid"

        # The LinkedIn adapter: the only package that imports mautrix-linkedin's
        # linkedingo. Only the daemon links it; its sessions reach it through an
        # interface the daemon backs with the keyring.
        linkedin-is-the-adapter:
          files:
            - "**/internal/linkedin/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "github.com/EugeneShtoka/kith/internal/linkedin"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/rs/zerolog"
            - "go.mau.fi/mautrix-linkedin/pkg/linkedingo"
            - "go.mau.fi/util/jsontime"

        # Local-first reading, shared by the networks: domain types only.
        readstate-is-a-leaf:
          files:
            - "**/internal/readstate/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/domain"

        # Disappearing messages' deletion, shared by the networks: domain types only.
        expiry-is-a-leaf:
          files:
            - "**/internal/expiry/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/domain"

        # QR codes as text: a leaf over the encoder, drawn by the clients.
        qrtext-is-a-leaf:
          files:
            - "**/internal/qrtext/**"
            - "!$test"
          allow:
            - "$gostd"
            - "rsc.io/qr"

        # A device's key, ID and certificate: crypto only. Keeping the key is keystore's.
        devicekey-is-a-leaf:
          files:
            - "**/internal/devicekey/**"
            - "!$test"
          allow:
            - "$gostd"

        # What both ends of a QR pairing share: the token, the digits, the URI.
        pairing-is-a-leaf:
          files:
            - "**/internal/pairing/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/devicekey"

        # The command templates kith ships: embedded files and the block they write.
        cmdtemplates-is-a-leaf:
          files:
            - "**/internal/cmdtemplates/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/BurntSushi/toml"
            - "github.com/EugeneShtoka/kith/internal/config"

        # The Signal adapter: kithd's side of kith-signal. Pure Go: it starts the helper,
        # keeps it alive and speaks its wire, and never links libsignal (meow) itself.
        signal-is-the-adapter:
          files:
            - "**/internal/signal/**"
            - "!$test"
          allow:
            - "$gostd"
            - "connectrpc.com/connect"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/expiry"
            - "github.com/EugeneShtoka/kith/internal/markdown"
            - "github.com/EugeneShtoka/kith/internal/readstate"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/google/uuid"

        # kith-signal's process: SignalService and the heartbeat, over Network. Pure Go,
        # so it builds and is tested without cgo; it never sees kithd's cache.
        signalhelper-serves-the-wire:
          files:
            - "**/internal/signalhelper/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "connectrpc.com/connect"
            - "github.com/EugeneShtoka/kith/internal/api/signal/v1"

        # Signal itself: the only package that imports mautrix-signal (libsignal, cgo).
        # Only kith-signal built with the signal tag links it; kithd and kith never do.
        signalhelper-meow-is-signal:
          files:
            - "**/internal/signalhelper/meow/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/api/signal/v1"
            - "github.com/EugeneShtoka/kith/internal/sealeddb"
            - "github.com/EugeneShtoka/kith/internal/signalhelper"
            - "github.com/google/uuid"
            - "github.com/rs/zerolog"
            - "go.mau.fi/mautrix-signal/pkg"
            - "go.mau.fi/util/dbutil"
            - "google.golang.org/protobuf"

        # The mesh's data model: clocks, dots, version vectors, signed ops and the roster's
        # rules. Pure: device IDs and keys, nothing that stores or dials.
        mesh-crdt-is-pure:
          files:
            - "**/internal/mesh/crdt/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/devicekey"

        # A replica's store: its ops and entries, sealed under the cache's key, and the
        # sync session over the mesh's frames. kithd's alone (deps-check keeps it out of
        # every client).
        mesh-is-a-store:
          files:
            - "**/internal/mesh/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api/mesh/v1"
            - "github.com/EugeneShtoka/kith/internal/devicekey"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/human"
            - "github.com/EugeneShtoka/kith/internal/mesh/crdt"
            - "github.com/EugeneShtoka/kith/internal/sealeddb"

        # Encrypted SQLite for the network stores that act as the account: a leaf over
        # ncruces' SQLite (WebAssembly, pure Go) and its Adiantum VFS.
        sealeddb-is-a-leaf:
          files:
            - "**/internal/sealeddb/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/gofrs/flock"
            - "github.com/ncruces/go-sqlite3"

        # Keys in the OS keyring, bounded, with a 0600 file as the opted-in fallback; and
        # the device key kept there. Clients link it to dial a bridge, so it holds no
        # network's session: that is session's, built on it.
        keystore-is-a-leaf:
          files:
            - "**/internal/keystore/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/devicekey"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/keystore"
            - "github.com/zalando/go-keyring"

        session-is-a-leaf:
          files:
            - "**/internal/session/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/keystore"
            - "github.com/EugeneShtoka/kith/internal/session"
            - "github.com/adrg/xdg"
            - "github.com/zalando/go-keyring"

        # A folder of Markdown files other programs share: plain files and YAML, nothing
        # of kith's.
        phonebook-is-a-leaf:
          files:
            - "**/internal/phonebook/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/phonebook"
            - "gopkg.in/yaml.v3"

        schedule-is-a-leaf:
          files:
            - "**/internal/schedule/**"
          allow:
            - "$gostd"
            - "github.com/BurntSushi/toml"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/schedule"
            - "github.com/adrg/xdg"

        # Backup and restore: the cache through db's own copy and checks, the config
        # and its storage, and the daemon's lock. kithd runs it; no client links it.
        backup-is-daemon-side:
          files:
            - "**/internal/backup/**"
            - "!$test"
          allow:
            - "$gostd"
            - "filippo.io/age"
            - "github.com/EugeneShtoka/kith/internal/buildinfo"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/daemon"
            - "github.com/EugeneShtoka/kith/internal/db"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/mesh"
            - "github.com/EugeneShtoka/kith/internal/setup"

        # The daemon's model layer from the config: the only place outside matrix that
        # sees the model clients, so clients that need setup do not link them.
        modelsetup-is-daemon-side:
          files:
            - "**/internal/modelsetup/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/llamacpp"
            - "github.com/EugeneShtoka/kith/internal/llm"
            - "github.com/EugeneShtoka/kith/internal/modelsetup"
            - "github.com/EugeneShtoka/kith/internal/setup"

        # Leaves: stdlib (plus the named transport) only. Process spawners and model
        # clients especially must not see Matrix, the cache or the config.
        audio-is-a-leaf:
          files:
            - "**/internal/audio/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/audio"

        # The daemon side runs headless under systemd.
        no-bubbletea-in-infra:
          files:
            - "**/internal/matrix/**"
            - "**/internal/db/**"
            - "**/internal/domain/**"
            - "**/internal/media/**"
            - "**/internal/session/**"
            - "**/internal/notify/**"
            - "**/internal/audio/**"
            - "**/internal/daemon/**"
            - "**/internal/schedule/**"
          deny:
            - pkg: "charm.land/bubbletea/v2"
              desc: "infrastructure packages must not import bubbletea; keep the TUI framework in internal/tui"

        # tui-no-infra checks direct imports only, so what it allows must be pure.
        seam-is-a-sink:
          files:
            - "**/internal/api/*.go"
            - "**/internal/apitest/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/api"
            - "github.com/EugeneShtoka/kith/internal/apitest"
            - "github.com/EugeneShtoka/kith/internal/domain"

        # The generated wire types: protobuf and connect only. (golangci-lint skips
        # generated files, so this rule is here for depguard-coverage-check and for
        # anything hand-written added beside them.)
        wire-is-generated:
          files:
            - "**/internal/api/backend/v1/*.go"
            - "**/internal/api/backend/v1/backendv1connect/**"
          allow:
            - "$gostd"
            - "google.golang.org/protobuf"
            - "connectrpc.com/connect"
            - "github.com/EugeneShtoka/kith/internal/api/backend/v1"

        # kith-signal's wire (SignalService), generated likewise.
        signal-wire-is-generated:
          files:
            - "**/internal/api/signal/v1/*.go"
            - "**/internal/api/signal/v1/signalv1connect/**"
          allow:
            - "$gostd"
            - "google.golang.org/protobuf"
            - "connectrpc.com/connect"
            - "github.com/EugeneShtoka/kith/internal/api/signal/v1"

        # The mesh's wire (MeshService, bridge to bridge), generated likewise.
        mesh-wire-is-generated:
          files:
            - "**/internal/api/mesh/v1/*.go"
            - "**/internal/api/mesh/v1/meshv1connect/**"
          allow:
            - "$gostd"
            - "google.golang.org/protobuf"
            - "connectrpc.com/connect"
            - "github.com/EugeneShtoka/kith/internal/api/mesh/v1"

        # kith-relay's wire (DeviceService), generated likewise.
        device-wire-is-generated:
          files:
            - "**/internal/api/device/v1/*.go"
            - "**/internal/api/device/v1/devicev1connect/**"
          allow:
            - "$gostd"
            - "google.golang.org/protobuf"
            - "connectrpc.com/connect"
            - "github.com/EugeneShtoka/kith/internal/api/device/v1"

        # Wire <-> domain mapping; no infrastructure.
        protoconv-maps-wire-to-domain:
          files:
            - "**/internal/api/backend/v1/protoconv/**"
          allow:
            - "$gostd"
            - "google.golang.org/protobuf"
            - "github.com/EugeneShtoka/kith/internal/api/backend/v1"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/richtext"
            - "github.com/EugeneShtoka/kith/internal/notify"

        # In-memory completion ranking: text in, candidates out.
        vocab-is-a-leaf:
          files:
            - "**/internal/vocab/**"
          allow:
            - "$gostd"
            - "golang.org/x/text"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/EugeneShtoka/kith/internal/spell"
            - "github.com/EugeneShtoka/kith/internal/vocab"

        llm-is-a-leaf:
          files:
            - "**/internal/llm/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/llm"

        llamacpp-is-a-leaf:
          files:
            - "**/internal/llamacpp/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/llamacpp"
            - "github.com/EugeneShtoka/kith/internal/human"

        agent-is-a-leaf:
          files:
            - "**/internal/agent/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/agent"
            - "github.com/EugeneShtoka/kith/internal/domain"
            - "github.com/adrg/xdg"
            - "github.com/gofrs/flock"

        # The shared log format; stdlib plus go-systemd's journal client (the native
        # journald sink) and nothing of ours, so every layer may use it.
        logging-is-a-leaf:
          files:
            - "**/internal/logging/**"
          allow:
            - "$gostd"
            - "github.com/coreos/go-systemd/v22/journal"
            - "github.com/rs/zerolog"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/human"

        # Values formatted for people (a duration as "1m 30s"): stdlib only, so every
        # layer, logging included, may use it.
        human-is-a-leaf:
          files:
            - "**/internal/human/**"
          allow:
            - "$gostd"

        # Emoji by name, shared by the client and the Slack adapter: data alone.
        emoji-is-a-leaf:
          files:
            - "**/internal/emoji/**"
          allow:
            - "$gostd"

        # What the composer types, rendered to HTML: one renderer for every network
        # that sends formatting. Daemon-side (mautrix's extensions), not the TUI's.
        markdown-renders:
          files:
            - "**/internal/markdown/**"
          allow:
            - "$gostd"
            - "github.com/yuin/goldmark"
            - "maunium.net/go/mautrix/format"

        richtext-is-a-leaf:
          files:
            - "**/internal/richtext/**"
          allow:
            - "$gostd"
            - "golang.org/x/net/html"

        setup-derives-from-config:
          files:
            - "**/internal/setup/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/audio"
            - "github.com/EugeneShtoka/kith/internal/config"
            - "github.com/EugeneShtoka/kith/internal/domain"
            # The catalog only: validating a model name must not link the server.
            - "github.com/EugeneShtoka/kith/internal/llamacpp/models"
            - "github.com/EugeneShtoka/kith/internal/logging"
            - "github.com/EugeneShtoka/kith/internal/notify"
            # [[bridge]]: its id reads as a device ID, its addresses as a pairing URI's.
            - "github.com/EugeneShtoka/kith/internal/devicekey"
            - "github.com/EugeneShtoka/kith/internal/pairing"
            # A profile's people.exclude names phonebook fields in the phonebook's own
            # term syntax; the phonebook is a leaf (files and YAML).
            - "github.com/EugeneShtoka/kith/internal/phonebook"
            - "github.com/EugeneShtoka/kith/internal/setup"
            # The theme as data only: every binary links setup, and only the TUI draws.
            - "github.com/EugeneShtoka/kith/internal/themespec"
            # Storage's defaults are the XDG directories.
            - "github.com/adrg/xdg"
            # Only to check [backup] key is an age public key, wherever the config is read.
            - "filippo.io/age"
            # [backup] cron: its parser, so every reader of the config checks it alike.
            - "github.com/robfig/cron/v3"

        notify-is-pure:
          files:
            - "**/internal/notify/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/notify"
            - "github.com/godbus/dbus/v5"

        spell-is-a-leaf:
          files:
            - "**/internal/spell/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/spell"
            - "github.com/EugeneShtoka/kith/internal/human"

        launch-is-a-leaf:
          files:
            - "**/internal/launch/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/launch"

        focus-is-a-leaf:
          files:
            - "**/internal/focus/**"
          allow:
            - "$gostd"
            - "github.com/EugeneShtoka/kith/internal/focus"

        filedialog-is-a-leaf:
          files:
