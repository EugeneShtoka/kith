# kith configuration, with every option documented at its default. No account is
# needed here: `:login` inside kith sets one up — Matrix ([[matrix.account]] below),
# WhatsApp, Slack or Telegram — and writes it in. The file holds no secrets: the password
# is prompted for on first login and the access token lives in the OS keyring.
#
# Press "," in kith for the settings screen, and "a"/"b" on a person, room or group
# to name it or set its notification rule. Changes made in the app are written back
# here (only values that differ from the defaults; comments are not kept, and a .bak
# is left the first time). `kith --print-config` prints this reference.
#
# This is the bridge's file: what kithd reads. What only a client reads — its look,
# keys, how it shows a notification — is in device.toml beside it (`kith
# --print-device-config`), so each device may differ; a table split between the two
# keeps its name in both.
#
# Unknown keys are refused at startup.

# On a headless box with no OS keyring, persist the access token to a 0600 file
# instead of refusing to store it.
# allow_token_file = true

# Bridges whose contact lists name people a network shows only by number: each
# bridge's provisioning API, as your server exposes it (a mautrix bridge answers at
# /_matrix/provision on its own port; put it behind a path of your homeserver). kith
# asks with your Matrix login, every few hours, for the contacts of each of your
# logins there, and a number in any of them is named everywhere, as a phone's address
# book does.
#
#   bridge_contacts = [
#     "https://matrix.example.org/_matrix/provision/whatsapp-home",
#     "https://matrix.example.org/_matrix/provision/whatsapp-work",
#   ]
bridge_contacts = []

[display]

# How times and dates are written, everywhere kith shows one to you (desktop
# notifications included; what scripts and assistants are handed stays RFC 3339).
#
# time_format is one of: 24h (14:30), 12h (2:30 PM), 12h-lower (2:30pm),
# zh (下午2:30), ja (午後2:30), ko (오후 2:30).
#
# The dates are patterns: runs of Y, M and D are filled in, anything else is written
# as it stands, so any separators and order work.
#
#   YYYY 2026   YY 26
#   M    10     MM 10   MMM Oct   MMMM October
#   D    8      DD 08   DDD Thu   DDDD Thursday
#
#   "DD.MM.YYYY"  "MM/DD/YY"  "DDDD, D MMMM YYYY"  "YYYY年M月D日"
#
# long_date_format heads each day in a timeline; short_date_format is the date in
# lists (search results, edit history) and in notifications.
time_format = "24h"
long_date_format = "DDD, DD MMM YYYY"
short_date_format = "YYYY-MM-DD"

# The place vocabulary, which every list of places in this file takes: a room ID bare,
# `room:<name>`, `space:<name>`, `tag:<name>`, `place:<name>`, `protocol:<network>`,
# `dm`, `group`. `place:<name>` is every rail row shown as <name> (its label after a
# rename, or its name, in any case): a space, a tag, a forum, a community, a
# workspace. A setting naming rail rows (priority, the rail's lists, space_rule,
# rooms rules) takes space:, tag: and place:. A bare name is refused at startup.

# Preference order when one home must be chosen for a room in several spaces or tags:
# the {space} of a notification, the download folder, which [[display.space_rule]]
# applies, which place rule counts as the room's space. Spaces as space:<name>, tags
# as tag:<name>, or place:<name>. What it does not name follows the rail's order
# ([display.rail]); what the rail does not name either goes where its "*" is: tags in
# the order they are written, then spaces you made, then a network's own (a bridge's,
# a WhatsApp account's, a Slack workspace's). A tag of every room (All) is a room's
# home only when nothing else is.
# priority = ["tag:Family", "space:Work", "place:Friends"]

# Apply the name rules (first_name_only, …) to rooms named after their participants
# (DMs, bridge rooms) too.
# room_name_rules = true

# What a badge counts, and what makes a room unread to a tag's `unread` (every device
# alike, since kithd builds the rail):
#
#   messages      — what you have not read, from the local cache (default)
#   notifications — what your push rules would have notified you about, as the
#                   homeserver counts it (a muted room badges nothing)
unread = "messages"

# Per-place rules: space is space:<name>, tag:<name> or place:<name>.
# first_name_only shows just the first token of a sender's name. A room in two places
# follows the one selected in the rail in the room list, else its home (see priority).
# network_colors names each room in this place's room list in its network's color
# ([display.theme.networks]), true or false whatever [display] network_colors (in
# device.toml) says.
# show_archived lists archived rooms in this place's room list, true or false whatever
# [display] show_archived (in device.toml) says.
# show_field names a phonebook field ([phonebook]) whose value this place shows after a
# person's name: in its room list on a DM or a room with one person in it, and in the
# member list ("Dana Levi · Meta").
# [[display.space_rule]]
# space = "space:Friends"
# first_name_only = true
# network_colors = true
# show_archived = false
# show_field = "company"

# Merge several accounts into one person with a shared alias and/or fixed color
# (#rrggbb or a named color). Both are optional. An alias chooses which name to show;
# the space's name rules still shorten it ("Dana Levi" → "Dana" under first_name_only).
# [[display.identity]]
# alias = "Eugene"
# color = "#8ff586"
# ids = ["matrix:@eugene:example.org", "matrix:@whatsapp_1234:example.org"]

# Names you gave things: a room, a space, a rail row, a thread (`a` on it in the app).
# `target` is one of:
#
#   matrix:4f1c9e2a7b3d5c60/!abcdef:example.org   a room, by ID
#   room:Team Standup     a room, by the name this client shows for it
#   space:Work            a space (and its rail row); a tag is named in its [[tag]]
#   thread:matrix:4f1c9e2a7b3d5c60/$abcdef     a thread, by its root event (default label: a snippet of it)
#
# A bare word that is not a room ID is refused at startup. A Matrix ID says which of
# your accounts sees it: matrix:<account>/!room, matrix:<account>/$event, and a person
# matrix:@user:server. Copy them as kith shows them; a bare !room or @user is refused.
# [[display.name]]
# target = "matrix:4f1c9e2a7b3d5c60/!abcdef:example.org"
# name = "Team Standup"
#
# [[display.name]]
# target = "thread:matrix:4f1c9e2a7b3d5c60/$abcdef"
# name = "Release notes"

# Words marked wherever they are said, and listed by `/tracked` or `:tracked`. Each
# entry sets its own width with `*`:
#
#   deploy      the whole word only
#   deploy*     a word starting with it
#   *deploy*    anywhere, inside another word included
#   *deploy     a word ending with it
#
# Case is folded, and a mark covers the whole word containing the match. (Hebrew
# prepositions attach to the word, so Hebrew entries usually want `*` on the left.)
[display.tracked]
# These words everywhere (shorthand for one rule with no range).
words = []
# Whether a hit also notifies, as a mention does.
notify = false

# Rules with a range. Rules add up (they are a set, not a narrowest-wins ladder).
#
#   [[display.tracked.rule]]
#   words  = ["deploy", "rollback"]
#   in     = ["space:Work"]          # where it counts; absent = everywhere
#   except = ["room:Noise"]          # never here; wins over `in`
#   from   = ["matrix:@dana:example.org"]   # only these senders; absent = anybody
#   notify = true                    # overrides the switch above for these words
#
# `in`/`except` take the place vocabulary (see [display]).

# Tags: your own groupings of rooms, across networks, shown in the rail with the
# spaces; a room can carry several. A tag holds the rooms its rule matches, plus the
# rooms `picked`, minus the rooms `excluded` (each a room ID or room:<name>; excluded
# wins over picked). A rule is a list of terms: a room matches when some term matches
# and no `not` term does (a rule of `not` terms alone needs none; an empty rule holds
# only picked rooms). Terms: `*` (every room), the place words (room:<name>,
# space:<name>, protocol:<network>, dm, group), the state words (unread,
# mention, draft, invite) and tag:<name> (another tag's rooms). `hidden = true`
# keeps a tag out of the rail. In the rail order below a tag is `tag:<name>`. Tags
# whose rules depend on each other in a cycle are reported at startup, and their
# references to each other match nothing.
#
# Properties (all off unless set):
#   counts_unread = false   its rooms count as read everywhere else: no badge, not
#                           `unread`/`mention` to other tags, skipped by mark-all-read
#   notifies      = false   nothing in its rooms notifies (codes are still copied)
#   exclusive = [...]       where its rooms leave, any of:
#                             "tags"    every other tag; of two such tags, the
#                                       first configured keeps them
#                             "spaces"  spaces they do not belong to
#                             "origin"  the spaces they belong to: a bridge's, a
#                                       community, their canonical home
#   sticky          = true  the open room stays listed until you move off it
#   hide_when_empty = true  no rail row while it holds nothing
#   first           = true  at the top of the rail, unless the order places it
#   count_in_label  = true  the row says how many rooms it holds
#   push_archive    = true  mirror the tag's membership into each room's network
#                           archive — a room joining the tag calls SetArchived on
#                           its network, leaving unarchives what kith archived (a
#                           chat you archived on the phone stays). Per-device: `true`
#                           on a laptop with `false` on a homelab keeps the homelab's
#                           narrower view local.
#   people = [...]          senders put in it by hand, one ID each. A muted tag's
#                           (notifies = false) are hidden in every room: their
#                           messages and the direct replies to them, as kith links
#                           their IDs (identities, the people directory). Your own
#                           are never hidden.
# Exclusivity decides where a room shows, not what rules match: `tag:<name>` still
# matches a room another tag claims.
#
#   [[tag]]
#   name     = "Family"
#   rule     = ["dm", "space:Family", "not room:Bank"]
#   picked   = ["matrix:4f1c9e2a7b3d5c60/!abc:example.org"]
#   excluded = []
#   hidden   = false
#
# Only the tags written here exist. The ones below are a starting point, not built
# in: change their rules, rename them, or delete them. A room goes into a tag, or out
# of one, from the filing picker (`S`) or with `/tag <name>`; that edits the tag's
# picked and excluded lists here. The picker's New tag row, or `/tag` with a name no
# tag has, makes the tag with the room in it. A [[filter]] moves rooms into a tag too
# (see Filters below), and [[keys.tag]] in device.toml binds a key to one.

[[tag]]
name = "DMs"
rule = ["dm"]

# Sticky: the room you opened stays listed while you read it.
[[tag]]
name   = "Unread"
rule   = ["unread"]
sticky = true

[[tag]]
name            = "Drafts"
rule            = ["draft"]
hide_when_empty = true

# No rule: only the rooms you put in it.
[[tag]]
name            = "Pinned"
hide_when_empty = true

# Rooms kept but quiet: no badge, not Unread, out of every other tag and of the spaces
# you made (the space a room belongs to keeps it).
[[tag]]
name            = "Archived"
counts_unread   = false
exclusive       = ["tags", "spaces"]
hide_when_empty = true

# Where unwanted conversations go: by hand (`!`, bound below) or by a [[filter]].
# Quiet, uncounted, and out of every other tag and space, its own included. A person
# goes here too (people): `!` on their message hides them in every room, and `z h`
# shows them in the open room.
[[tag]]
name            = "Spam"
counts_unread   = false
notifies        = false
exclusive       = ["tags", "spaces", "origin"]
hide_when_empty = true

# At the top of the rail, saying how many are waiting.
[[tag]]
name            = "Invites"
rule            = ["invite"]
exclusive       = ["tags"]
first           = true
count_in_label  = true
hide_when_empty = true

# Every room. Its rooms are also in their spaces; Archived and Spam take theirs out.
# A tag of every room is a room's home (its {space}, its download folder) only when
# nothing else is.
[[tag]]
name = "All"
rule = ["*"]

# Rail layout: space:<name>, tag:<name>, or place:<name> for every row shown as
# <name> (placed together, in rail order). "-" draws a divider after the preceding
# group; "*" stands for every group not named. Unlisted groups (with no "*") follow in
# default order. A tag marked `first` goes to the top unless named here.
#
# Rename a space's row with [[display.name]] (target = "space:Work").
[display.rail]
order = ["tag:All", "tag:DMs", "tag:Unread", "tag:Drafts", "tag:Pinned", "-", "*", "-", "tag:Archived", "tag:Spam"]
# Rows hidden while they hold nothing (as order names them); a tag can say so itself
# (hide_when_empty).
#
#   hide_when_empty = ["space:Work"]
hide_when_empty = []
# Rows never shown (as order names them); a tag can say so itself (hidden).
hidden = []
# Name a space or tag whose rooms are all on one network in that network's color
# ([display.theme.networks], in device.toml).
network_colors = false

# Profiles: named setups, each with its own rooms. `kith --profile <name>` runs in
# one: its room list, unread, invitations, drafts and search hold only those rooms
# (a room named directly, by a link or a jump, still opens); without it, kith runs in
# the first. gP or :profile switches a window to another. A profile is also a
# notification topic: kith-notify shows the ones it listens to (the first, unless
# given --profile), and a room no profile holds never notifies. A config has at
# least one.
#
#   include = [...]   its rooms, as places (space:, tag:, place:, room:, protocol:,
#                     a room ID, dm, group), or "*" for every room
#   exclude = [...]   rooms it leaves out, though include names them
#
# A tag whose rule reads a room's state (unread, mention, draft, invite) cannot name
# a profile's rooms: a room would enter and leave the profile as it is read.
#
#   [[profile]]
#   name    = "work"
#   include = ["space:Work", "protocol:slack"]
#   exclude = ["tag:Archived"]
#
# A profile can have an archive and a rail of its own; what it leaves unset is the
# shared one.
#
#   archive.rooms   the rooms archived in this profile, written as a tag's rule
#                   (`not` entries too): it replaces the archive tag's rule here (the
#                   tag [whatsapp.archive] and [telegram.archive] name, Archived by
#                   default). Empty keeps the tag's rule. Filing a room by hand (S,
#                   /tag Archived) still files it in every profile, and a chat
#                   archived on its network ([<network>.archive] follow) is archived
#                   in every profile.
#   archive.push    archives this profile's archived rooms on their network, as the
#                   tag's push_archive does; unset keeps the tag's. Profiles that push
#                   add up: a chat stays archived on its network while any pushing
#                   profile archives it, and a profile pushes only rooms it holds.
#                   Letting go unarchives only what kith archived. A profile that stops
#                   pushing, or is removed, leaves the network as it is.
#   rail            replaces [display.rail] in this profile, whole, once it sets
#                   anything: order, hidden, hide_when_empty, network_colors.
#
#   [[profile]]
#   name    = "phone"
#   include = ["dm", "tag:Family", "protocol:signal"]
#   [profile.archive]
#   rooms = ["not tag:Family"]
#   push  = false
#   [profile.rail]
#   order = ["tag:Unread", "tag:Family", "*"]
#
# (archive = { rooms = [...], push = false } on the [[profile]] says the same.)
#
# A profile can hide people too, as a muted tag's people are hidden everywhere: their
# messages and the direct replies to them leave its timeline, search, counts and
# notifications. people.exclude takes person IDs (as [[tag]] people does) and
# phonebook card fields, key:value, matched word for word ("role:colleagues" hides
# everyone whose card's role holds the word colleagues). Never you.
#
#   [profile.people]
#   exclude = ["role:colleagues", "whatsapp:+15550100"]
[[profile]]
name    = "default"
include = ["*"]

# Deleted messages, set separately for yours (every account in your identity) and
# everybody else's:
#
#   show — a "(deleted)" placeholder where the message was (default)
#   hide — remove the row
#
# A deleted message that a thread hangs off is always shown.
[display.deleted]
mine   = "show"
others = "show"
# Keep what a deleted message said in the local cache. Off: its content is erased
# from disk when the deletion arrives (who, why and when are kept either way; `H`
# shows them).
keep   = false

# Notifications: what notifies, decided by [[notifications.rule]] below, whether it
# rings, and how often one room may. Your own messages never notify. Whether this
# device shows them, and how (a popup, a command, the templates, the sounds), is
# [notifications] in device.toml.
[notifications]
# Popups one room may raise per rate_window before further messages are counted into
# one "12 new messages" summary that replaces the room's previous one. Nothing is
# dropped. 0 = no limit.
max_per_room = 0
# max_per_room = 5
rate_window = "2m"

# Do-not-disturb is a keystroke, not a setting: `ctrl+n` hides notifications, `alt+n`
# silences only the sound; each asks what (everything, a space, a room, a person) and
# for how long. It lives in kithd and clears on a daemon restart.

# Rules decide what notifies. A rule says where, when, and what gets through:
#
#   name    shown when the status line says which rule silenced you; a device
#           gives the rule its own sound by this name ([notifications.sounds] in
#           device.toml)
#   match   one place: a room ID, room:<name>, space:<name>, tag:<name>,
#           protocol:<network>, dm or group; empty = anywhere. A bare word
#           is refused.
#   sender  one person's MXID; empty = anyone
#   when    a daily window, "22:00-08:00"; absent = always
#   thread  any (default) · participating (threads you spoke in) · none (outside
#           threads)
#   show    the bar to raise a popup: none · mention · dm · all
#   ring    the bar to also make a sound; unset follows `show`
#
# A rule changes only the fields it sets. A message must clear `show` before `ring` is
# asked. A built-in account-wide rule (show = "mention") always applies first, and your
# rules are layered on top of it; a rule with no `match` and no `sender` (like
# "everything" below) sets the account-wide level.
#
# Which rule wins: more constraints beat fewer, and among equals a person beats a room
# beats a space (person > room > space > nothing): a person's rule holds wherever they
# are, muted or let through. Then a mute you just pressed beats a rule
# here, and later in the file wins. So a rule naming a room, space or person gets
# through quiet hours and do-not-disturb on its own. `W` in the app shows every rule in
# force for the open room; `b` on a message, room or space writes one.
#
# [[notifications.rule]]
# name = "everything"            # the account-wide rule: no match, no sender
# show = "mention"
#
# [[notifications.rule]]
# name = "quiet hours"           # the same rule, on a schedule
# when = "22:00-08:00"
# show = "none"
#
# [[notifications.rule]]
# match = "space:Work"           # a whole space
# show = "all"
#
# [[notifications.rule]]
# match = "matrix:4f1c9e2a7b3d5c60/!standup:server"      # mute a room…
# show = "none"
#
# [[notifications.rule]]
# name = "the boss"              # …except one person in it, who also gets through
# match = "matrix:4f1c9e2a7b3d5c60/!standup:server"      # quiet hours and do-not-disturb
# sender = "matrix:@alice:server"
# show = "all"                   # its sound: [notifications.sounds] in device.toml
#
# [[notifications.rule]]
# match = "space:Social"         # popups without sound
# ring = "none"
#
# [[notifications.rule]]
# match = "matrix:4f1c9e2a7b3d5c60/!busy:server"         # only the threads you joined
# thread = "participating"
# show = "all"

# `auto_copy` lets kithd copy a verification code as it arrives. It is remotely
# triggerable by anyone who can message you, so it fails closed:
#
#   * it needs `[codes] include` to name somewhere (empty means everywhere);
#   * it needs [clipboard] `command` in device.toml and a graphical session visible
#     to kith-notify (a systemd user unit may need `systemctl --user
#     import-environment WAYLAND_DISPLAY`); without one the code is put in the
#     notification instead;
#   * only live messages, never ones caught up on after downtime;
#   * it ignores do-not-disturb and always says what it copied.
[clipboard]
auto_copy = false # needs `command`, a graphical session, and a [codes] include

# Verification codes: where to look, and what one looks like. Naming the place codes
# arrive (e.g. an SMS bridge) matters more than the shape rules.
#
# include/exclude take the place vocabulary:
#
#   matrix:4f1c9e2a7b3d5c60/!abc:server   that room, by ID
#   room:Standup         whatever is shown under that name
#   space:Bridges        every room in that space
#   protocol:WhatsApp    every room on that network
#   dm / group           every direct message, or everything that is not one
#
# A bare word that is not a room ID is refused at startup. Empty include = everywhere;
# exclude wins. Neither list gates the `yc` key on a message you are looking at; they
# govern the "copy code" hint and auto_copy.
[codes]
include = []               # e.g. ["protocol:Google Messages", "!sms-bridge:server"]
exclude = []               # e.g. ["space:Work"]

# Code shape: length bounds, allowed characters, and extra `symbols` ("-_").
min_length = 4
max_length = 8
letters    = true
digits     = true
symbols    = ""            # extra characters a code may contain

# At least one digit (stops "your code is expired" yielding "expired").
require_digit = true

# A shape that can never match (no characters allowed, or max < min) is refused at
# startup.

# ─────────────────────────────────────────────────────────────────────────────
# Filters: words or a sender that move a conversation into a tag (the starter's
# Spam, or any other). `/caught` previews what they catch, `:rescan` judges what is
# already cached, and `/why` in a moved room names the filter and the rule.
#
# Each [[filter]] needs a name (what `/why` reports) and the tag it moves rooms into.
# Words take the tracked-word globs (`pay`, `pay*`, `*pay*`, `*pay`); `from` alone
# catches everything a sender writes, and a language clause alone everything in that
# language; it needs at least one. `in` limits it to places (empty is everywhere).
#
# A message's language is read from its letters, not guessed: the writing system is
# certain from one character, and letters only some languages use (ы, ß, ơ) narrow
# it. What they cannot settle stays undecided, so plain Latin letters could always be
# English. `lang` catches a message that is in one of its languages, `not_lang` one
# that cannot be in any of them; both take codes ("en", "zh"), a `family:` (slavic,
# germanic, romance, turkic, sino-tibetan, …) or a `region:` (asia-east,
# asia-southeast, asia-south, europe-east, …). `script` takes writing systems: Latin,
# Cyrillic, Hebrew, Arabic, Greek, Han (Chinese characters, no kana), Kana (Japanese),
# Hangul, Thai, Devanagari, … `moves` is which rules its catch moves a room by,
# ["first_message", "direct"] unless set:
#
#   always         any message it catches
#   first_message  the room's first message
#   direct         a message in a DM you never wrote in
#   ratio          at least `ratio` of the room's messages over `window` (0.6 over a
#                  week unless set), with at least `floor` of them (5), caught by it
#
# Three more mark the person who sent the message instead, in every room: in a muted
# tag (Spam) they are hidden everywhere. Never anyone you have written to (a DM you
# wrote in, or a reply to them).
#
#   sender_first   their first message anywhere you can see
#   sender_ratio   at least `ratio` of their messages over `window`, every room
#                  together, with at least `floor` of them, caught by it
#   sender_spread  the same caught message in `spread` rooms (3) within `window`
#
# Only you take a room or a person out: a filter never does, and one you took out
# stays out on every machine, so no filter puts it back. A move is stored in the
# room's account data, and a Matrix person's mark in the account's, so it survives a
# cache rebuild and reaches your other machines.
#
# [[filter]]
# name  = "crypto"
# tag   = "Spam"
# words = ["*bitcoin*", "*binance*", "invest*"]
# moves = ["first_message", "direct", "ratio"]
# ratio = 0.6
# floor = 5
# window = "168h"
# spread = 3
#
# [[filter]]
# name  = "that number"
# tag   = "Spam"
# from  = "matrix:@spammer:example.org"
#
# [[filter]]
# name  = "elections"
# tag   = "Spam"
# words = ["vote*"]
# in    = ["place:SMS"]
# moves = ["always"]
#
# [[filter]]
# name     = "not mine"
# tag      = "Spam"
# not_lang = ["en", "ru", "he"]       # in none of the languages I write
#
# [[filter]]
# name   = "east asian"
# tag    = "Spam"
# lang   = ["region:asia-east"]       # Chinese, Japanese, Korean, Mongolian
# script = ["Han", "Kana", "Hangul"]  # and written in their own scripts

# Spell-checking. The checker is a subprocess speaking the ispell pipe protocol, so
# `command` can be hunspell (default: loads several dictionaries in one process),
# enchant-2 -a, nuspell or aspell. Dictionaries are separate packages; with none,
# kith says so once, with the install command. How a word is marked and corrected is
# [spell] in device.toml.
[spell]
enabled = true
command = "hunspell"
# Installed dictionaries to load ("en_US", "he_IL"). Empty = every one found.
dictionaries = []
# Flag accepted words that a far commoner word is one slip away from (useful where the
# dictionary accepts too much, e.g. Hebrew). Needs word counts: `kith
# --add-frequencies he_IL` (or `list`). A hint only: marked quietly, never
# autocorrected, never blocks a send. Skipped for languages sharing a script with
# another installed dictionary.
flag_rare_words = false
# How many times commoner the neighbor must be. Higher is quieter.
rare_ratio = 100

# The local model that suggests next words, run with llama.cpp on this machine;
# nothing you type is sent anywhere. Needs `llama-server` on PATH and weights:
#
#   kith --add-model smollm2-360m        # checked against a pinned SHA-256
#   kith --add-model list
#
# kith offers the download once. The server starts on the first completion and
# stops after `idle` (it holds a few hundred MB while running). Word completion
# itself ([complete]) is in device.toml.
[complete.model]
# Unset means on whenever weights are installed.
enabled = true
# llama.cpp's server: a name on PATH, or a path.
command = "llama-server"
# A manifest tag or a path to a .gguf. Empty uses whichever installed model is found.
model = ""
# CPU threads; 0 = llama.cpp's default.
threads = 0
# Token window; 0 = 1024.
context = 0
# Loopback port; 0 = any free port.
port = 0
# Idle time before the server is stopped; "0s" = never.
idle = "10m"
# How long a spawn and one prediction may take.
startup = "20s"
timeout = "1s"
# Words the suggestion strip offers at once, 1 to 5 (one extra slot is always this
# room's own vocabulary).
options = 4
# Context put in front of the model: roughly `budget` tokens, the `recent` last
# messages, stopping at a silence of `gap`, plus `before_reply` messages before the one
# you are replying to. 0 uses the defaults shown.
budget       = 1500
recent       = 4
gap          = "90m"
before_reply = 2

# The remote model that answers questions about your conversations — `/summary`,
# `:todo`, rewriting a draft. Off: there is no default endpoint.
#
# Turning it on sends part of a conversation (your words and other people's) to the
# endpoint. No endpoint means off; an endpoint with no rooms allowed means off
# everywhere; encrypted rooms need `encrypted = true` as well. `alt+m` in the composer
# shows exactly what would be sent, and sends nothing.
#
# Any OpenAI-compatible `POST …/v1/chat/completions` works (Groq, Gemini's
# compatibility endpoint, Mistral, OpenRouter, ollama, llama.cpp):
#
#   endpoint = "http://localhost:11434/v1/chat/completions"   # ollama, local
#   model    = "llama3.1:8b"
#
#   endpoint = "https://api.groq.com/openai/v1/chat/completions"
#   model    = "llama-3.1-8b-instant"
#   key_ref  = "groq"          # after: kith --set-model-key groq
[assist]
endpoint = ""
model = ""
# The keyring entry holding the API key (a name, never the key). `kith
# --set-model-key <ref>` stores one; an empty answer removes it. Empty sends no
# Authorization header.
key_ref = ""
# Which rooms the model may see:
#
#   rooms non-empty          only those; `except` is not consulted
#   rooms empty, except set  every room but those
#   both empty               every room
#
# Entries take the place vocabulary (`space:Work`, `protocol:WhatsApp`, `dm`, `group`,
# `room:Standup`, a room ID), so "everything but private conversations" is
# `except = ["dm"]`. A room named in both lists is refused at startup.
rooms = []
except = []
# Whether end-to-end encrypted rooms are subject to the lists at all.
encrypted = false
# Roughly how many tokens of conversation may be quoted, newest first. Each task below
# may override it. 0 = default (1500).
budget = 1500
# Requests per rolling minute, and how long one may take.
max_per_minute = 20
timeout = "4s"
# How many rooms `:todo` may read at once.
todo_rooms = 8

# Per-task prompts. Empty values use the built-in defaults. Template fields: {draft}
# what you typed · {context} the conversation quoted (your messages marked "You:") ·
# {language} the draft's language · {instruction} what you asked for · {me} your
# display name · {names} every name you may be addressed by.
#
# Each task may set its own `model` (at the same endpoint) and `budget`. max_tokens
# includes a reasoning model's thinking, so leave room for it.
[assist.todo]
system = ""
prompt = ""
model = ""
budget = 9000
max_tokens = 1200
temperature = 0.0
reasoning_effort = "low"
stop = []

# Rewriting a draft to an instruction.
[assist.rewrite]
system = ""
prompt = ""
model = ""
budget = 0  # tokens of context; 0 uses [assist] budget
max_tokens = 800
temperature = 0.0
reasoning_effort = "low"
stop = []

# The thread namer. Its {context} is the thread. The name is cut to 48 characters.
[assist.thread_name]
system = ""
prompt = ""
model = ""
budget = 0  # tokens of context; 0 uses [assist] budget
max_tokens = 24
temperature = 0.0
reasoning_effort = "low"
stop = ["\n"]

# `/summary`: what this room said since you last read it, or over a span:
#
#   /summary            what you missed (the recent conversation if up to date)
#   /summary 2h         the last two hours (also 7d, 2w, 3m months, 1y)
#   /summary yesterday  or `today`, or a date: 2026-09-18
#   /summary 50         the last fifty messages
#
# The span words are the search box's (`since:2h`). The answer opens in a reader,
# never the composer.
[assist.summary]
system = ""
prompt = ""
model = ""
budget = 6000
max_tokens = 1600
temperature = 0.0
reasoning_effort = "low"
stop = []

# What an AI assistant attached to kith (`kith-mcp`, stdio) may read and write. Entries
# take the place vocabulary.
#
# [agent.read] — nothing is shared until listed: empty `rooms` means none.
#
#   rooms = ["space:Work"]                          one space
#   rooms = ["space:Work"], except = ["room:HR"]    Work without HR
#   rooms = ["dm", "group"], except = ["dm"]        everything but DMs
#   encrypted = false                               never an encrypted room
[agent.read]
rooms = []
except = []
encrypted = false
# Hand the assistant what the phonebook ([phonebook]) says of the people it finds.
people = false

# [agent.write] — narrowed by reading: it may write only where it may read, and send
# only where it may write. rooms/except read like [assist]'s (both empty: everywhere
# it may read). `encrypted` must also be on to write into encrypted rooms. `send` lists
# where it posts directly; everywhere else it leaves a draft in the composer, marked
# with who wrote it, in the rail's Drafts group.
#
#   send  = ["room:Notes"]       post there, draft elsewhere
#   rooms = ["room:Notes"]       write only in Notes
#
# A write entry that reading rules out is warned about at startup. `cooldown` makes a
# second message to the same room within the window a draft instead ("0" disables).
# Everything written is logged; `kith --agent-log` prints it.
[agent.write]
rooms = []
except = []
encrypted = false
send = []
cooldown = "1m"

# Messages written now and sent later (`/at`, `/in`). One whose time passed while
# nothing was running is still sent if at most this many hours late, and otherwise
# held for you to decide. 0 holds nothing: every late message is sent.
[schedule]
overdue_cutoff_hours = 24

# A folder of Markdown files, one per person, shared with whatever else reads it (a
# mail client, an Obsidian vault). A file's front matter says who it is about (phone,
# email, matrix, telegram, whatsapp, slack) and holds the person's fields (birthday,
# spouse, pets, …); its body is the person's notes, which kith never touches. `I` on a
# person opens theirs. Empty is $XDG_DATA_HOME/phonebook.
[phonebook]
dir = ""

# `level` is how much is logged: "debug", "info", "warn" or "error". `--log-level`
# and $KITH_LOG_LEVEL override it. Logs name rooms and events by ID, never their text.
#
# `target` is where the client and the daemon log: "journal" (systemd's journal,
# one entry per line with ROOM=, OP=, ERR=… as fields), "file"
# ($XDG_STATE_HOME/kith/kith.log, and kithd.log for a daemon kith started),
# or "auto", the journal when there is one and the file otherwise (macOS, FreeBSD,
# Windows, no systemd). "journal" with no journal logs to the file, saying so at its
# top. A daemon run as a systemd unit logs to the journal through its stderr
# whatever this says, and kith-mcp always logs to its stderr. `--log-target` and
# $KITH_LOG_TARGET override it; a change takes effect when the program restarts.
# See all of it with `journalctl --user -t kith -t kithd -f`.
[log]
level = "info"
target = "auto"

# Matrix: each [[matrix.account]] is one account on its homeserver. `name` is what
# `kith login matrix <name>` takes, `homeserver` the server's base URL and `user` the
# full Matrix ID. Several accounts run at once, each with its own session, device and
# crypto store; a room two of them are in shows as two rooms, one per account. Logging
# in asks the homeserver how: in the browser (OAuth or single sign-on) or with the
# password; kith keeps the session in the system keyring, never the password.
#
#   [[matrix.account]]
#   name       = "personal"
#   homeserver = "https://matrix.example.org"
#   user       = "@you:example.org"

[matrix]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that room comes first).
# Empty: kith asks which.
default = ""

# WhatsApp, linked directly: kith becomes one of the phone's linked devices, with no
# Matrix bridge in between. It runs when it has an account; `:login whatsapp` inside
# kith sets one up. Each [[whatsapp.account]] is one phone number: `name` is what `kith login whatsapp <name>` takes (it shows a
# code to type on the phone), and `phone` is the number, international ("+" and
# spaces are fine). Several accounts may be linked at once; a group two of them are
# in shows as two rooms, one per account.
#
# Link an account here or through a bridge, not both: both at once show every chat
# twice. WhatsApp's terms do not allow unofficial clients; accounts are rarely, but
# sometimes, banned for using one. The phone has to come online every two weeks or
# so, or WhatsApp unlinks its devices.
#
#   [[whatsapp.account]]
#   name = "personal"
#   phone = "+44 7700 900000"

[whatsapp]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# How WhatsApp's own archive and kith's archive tag go together. With both on, WhatsApp
# decides: the tag shows what WhatsApp has archived.
[whatsapp.archive]
# A chat archived on WhatsApp is in the tag, and in no other place kith files it.
# Taking it out in kith (with mirror off) keeps it out here only.
follow = true
# Putting a chat into the tag in kith, or taking it out, archives or unarchives it on
# WhatsApp too, on every device. Off by default: it changes your account, not just kith.
mirror = false
# Which [[tag]] the archive is.
tag = "Archived"

# Slack, linked directly: kith signs in to a workspace as the Slack web client does,
# with no Matrix bridge and nothing for the workspace's admins to approve. It runs
# when it has an account; `:login slack` inside kith sets one up. Each
# [[slack.account]] is one workspace: `name` is what
# `kith login slack <name>` takes, and `workspace` its address ("acme" or
# "acme.slack.com") or its ID: the T… in a link from the web client,
# app.slack.com/client/T…/…, which may be pasted whole. Several workspaces may be
# signed in at once.
#
# Sign in here or through a bridge, not both: both at once show every channel twice.
# Some workspaces' policies forbid clients Slack did not make; signing out of Slack
# in the browser you took the login from ends kith's session too.
#
#   [[slack.account]]
#   name = "work"
#   workspace = "acme"

[slack]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# Telegram, linked directly: kith logs in to the account as a Telegram client of its
# own, with no Matrix bridge. It runs when it has an account; `:login telegram` inside
# kith sets one up. Each [[telegram.account]] is one phone number: `name` is what
# `kith login telegram <name>` takes. Logging in asks first for an app's api_id and
# api_hash (my.telegram.org → API development tools), kept with the session in the
# system keyring; a build that carries kith's own app uses it when they are left
# empty.
#
# Log in here or through a bridge, not both: both at once show every chat twice.
# Telegram tells your other sessions about the new login.
#
#   [[telegram.account]]
#   name = "personal"
#   phone = "+359 88 000 0000"

[telegram]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# How Telegram's own archive and kith's archive tag go together. With both on, Telegram
# decides: the tag shows what Telegram has archived.
[telegram.archive]
# A chat archived on Telegram is in the tag, and in no other place kith files it.
# Taking it out in kith (with mirror off) keeps it out here only.
follow = true
# Putting a chat into the tag in kith, or taking it out, archives or unarchives it on
# Telegram too, on every device. Off by default: it changes your account, not just kith.
mirror = false
# Which [[tag]] the archive is.
tag = "Archived"

# Messenger, linked directly: kith signs in to your Meta account as the
# Messenger Lite app does, with no Matrix bridge. It runs when it has an account;
# `:login messenger` inside kith sets one up. Each [[messenger.account]] is one
# Meta account: `name` is what `kith login messenger <name>` takes. Logging in
# asks for your email or phone and password, then a second-factor code if your
# account has one; kith keeps the session in the system keyring, never the password.
#
# Sign in here or through a bridge, not both: both at once show every chat twice.
# A login from a new device can make Meta ask for a security check, which kith
# cannot answer: finish it on facebook.com, then log in again.
#
#   [[messenger.account]]
#   name = "meta"

[messenger]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# LinkedIn, linked directly: kith signs in with the session a browser holds, with
# no Matrix bridge. It runs when it has an account; `:login linkedin` inside kith
# sets one up. Each [[linkedin.account]] is one LinkedIn account: `name` is what
# `kith login linkedin <name>` takes. Logging in asks for the browser's cookies for
# www.linkedin.com; kith keeps them in the system keyring.
#
# Sign in here or through a bridge, not both: both at once show every chat twice.
# Signing out of LinkedIn in that browser ends kith's session too, so copy the
# cookies from a private window and close it without signing out.
#
#   [[linkedin.account]]
#   name = "linkedin"

[linkedin]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# Google Messages, linked directly: kith pairs with the Messages app on your Android
# phone as Messages for web does, with no Matrix bridge. It runs when it has an
# account; `:login gmessages` inside kith sets one up. Each [[gmessages.account]] is
# one phone: `name` is what `kith login gmessages <name>` takes. Pairing is with the
# Google account the phone's Messages uses: cookies from messages.google.com, then an
# emoji you tap on the phone. kith keeps the pairing in the system keyring.
#
# The phone relays every message, so it must stay online. Only one Messages for web
# session is active at a time: pairing kith takes it over from a browser or a bridge,
# and opening one of those takes it back.
#
#   [[gmessages.account]]
#   name = "phone"

[gmessages]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# Signal, linked directly: kith links to your phone as a secondary device, as Signal
# Desktop does, with no Matrix bridge. It runs when it has an account; `:login signal`
# inside kith sets one up. Each [[signal.account]] is one Signal account: `name` is
# what `kith login signal <name>` takes, and linking is a QR code you scan on the phone
# (Signal → Settings → Linked devices). Signal needs a helper of its own, kith-signal,
# installed beside kithd or on $PATH; without it there is no Signal.
#
#   [[signal.account]]
#   name = "phone"

[signal]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# Instagram direct messages, linked directly, with no Matrix bridge. It runs when it
# has an account; `:login instagram` inside kith sets one up. Each
# [[instagram.account]] is one Instagram account: `name` is what `kith login instagram
# <name>` takes. Signing in is with your browser's instagram.com cookies (paste a
# request's Cookie header, or a "Copy as cURL"): Instagram's password sign-in stops at
# a cookie-consent page kith cannot answer. kith keeps the session in the system
# keyring.
#
#   [[instagram.account]]
#   name = "me"

[instagram]
# With several accounts, the name of the one that opening a link, joining a room or
# starting a chat uses without asking (one already in that chat comes first).
# Empty: kith asks which.
default = ""

# Where this kith keeps its files. Each directory, when empty, is the usual place:
# data_dir    $XDG_DATA_HOME/kith    the cache, the encryption and WhatsApp stores,
#                                    dictionaries and models
# state_dir   $XDG_STATE_HOME/kith   the session file (when the keyring cannot hold
#                                    it), the assistant's ledger, the send-later
#                                    queue, logs
# cache_dir   $XDG_CACHE_HOME/kith   pictures (device.toml's [display.media] cache_dir
#                                    overrides), files on their way out
# runtime_dir $XDG_RUNTIME_DIR/kith  the daemon's socket and lock
# export_dir  <data_dir>/exports     where /export writes a conversation, when you
#                                    name no folder of your own
# A "~" at the start is your home directory.
#
# `instance` names this config's files inside them, so several configs (a test one
# beside your own, say) can share the directories without meeting. kith chooses it
# the first time it runs and writes it here; an install from before kept its files
# under a name made from the Matrix account, and goes on using that. Change it only
# with the files: with another name, kith starts over.
#
# `keyring_service` is the name its secrets (the session, the encryption key, API
# keys) are kept under in the OS keyring. A config with its own instance keeps its
# own session there whatever this says.
[storage]
instance = ""
data_dir = ""
state_dir = ""
cache_dir = ""
runtime_dir = ""
export_dir = ""
keyring_service = "kith"
# How many messages the cache keeps of each room, the newest; -1 keeps every one
# (search, the assistant and scrolling back work offline over all of it). Rules below
# set a place's own number.
messages_per_room = -1

# Per-place numbers. `match` names the place as any place list does: a room ID,
# room:<name>, space:<name>, tag:<name>, protocol:<network>, dm or group. One room
# beats a set of them; among equals, the later rule wins. A smaller number takes
# effect as the room's next messages arrive.
#
# [[storage.rule]]
# match    = "tag:Archived"
# messages = 500
#
# [[storage.rule]]
# match    = "protocol:telegram"
# messages = 5000

# kithd's scheduled backups: the cache, this config, your local records and the
# pictures, in one file encrypted to your backup key. `kith backup` makes one by hand
# whatever this says.
[backup]
# Scheduled backups on or off.
enabled = true
# The age public key (age1…) every backup is encrypted to, by hand or scheduled. Empty
# uses the key your first `kith backup` made and showed you. Put only the public key
# here, never the private one (AGE-SECRET-KEY-1…): `age-keygen -y` prints a private
# key's public half, and the key kith made is in <data_dir>/backup-<instance>.pub.
# Changing it switches the next backups; older ones still need the key they were made to.
key = ""
# Where scheduled backups go. Empty is <export_dir>/backups. Under the systemd unit
# kithd writes only kith's own folders: see docs/troubleshooting.md for another one.
dir = ""
# When scheduled backups are made: `every`, how long after one the next is (a duration,
# 6h or 90m, or days, 7d), or `cron`, a five-field cron expression for set times
# ("0 3 * * *" is 03:00 every day, "30 2 * * 1" Mondays at 02:30, local time). Set one,
# not both; with neither it is every 24h. Each backup copies the whole cache. A time
# the machine was off is skipped, not made up.
every = "24h"
cron = ""
# How many scheduled backups to keep; older ones are deleted. At least 1. Backups you
# made by hand or put in the folder yourself are never counted or deleted.
keep = 7

# Clients on other machines: kithd listens on each address in `listen` (host:port),
# over TLS 1.3, for the devices paired with it (`kith devices`) and nobody else. Empty,
# the default, listens nowhere: the socket on this machine is all there is. Only the
# addresses named are listened on: write the address of the network a client comes
# from (a LAN or tailnet address), or 0.0.0.0:7443 / [::]:7443 to take every
# interface; a bare ":7443" is refused. A change applies on the next reload.
[remote]
listen = []

# The graphical clients' theme (the desktop window), the same on every device; a
# device's own [gui.theme] (in device.toml, the same keys) overrides it key by key. The
# terminal client draws with [display.theme] and reads none of this. Every color is
# "#rrggbb"; a key left out is the window's default. The window's Settings → Theme
# writes these for you.
#
#   mode      "system" (the default) follows the system's light or dark; "light" and
#             "dark" keep to one.
#   accounts  a network account's color, by its rooms' owner as kith names it
#             ("whatsapp:main/"): its rooms' mark. Unset, its network's color
#             ([display.theme.networks] in device.toml).
#   people    a person's color, by their ID: their name and face. Unset, the color the
#             terminal client gives them in that room.
#
# [gui.theme]
# mode = "dark"
#
# Each mode's colors, one per role: accent, background, surface (the side columns),
# text, muted (times, hints), link, selection (the row you are on), unread and mention.
# [gui.theme.dark]
# accent = "#4c8dff"
# background = "#1e1f22"
#
# The same roles for light: accent, background, surface, text, muted, link, selection,
# unread and mention.
# [gui.theme.light]
# accent = "#1f6feb"
#
# Colors per account (accounts) and per person (people), as above.
# [gui.theme.accounts]
# "whatsapp:main/" = "#25d366"
#
# [gui.theme.people]
# "matrix:@ada:example.org" = "#d97706"
# Your own commands: `/zoom` runs the executable `zoom` in `dir`, and its stdout lands
# in the composer for you to send or not. A non-zero exit, timeout or empty output
# leaves the composer untouched and says why. Built-ins of the same name win.
#
# The script gets "$1" (the whole argument, one word, no shell), $KITH_ARG (same),
# $KITH_ROOM_ID, $KITH_ROOM and $KITH_USER. Keep secrets in the keyring (`secret-tool
# lookup …`), never on a command line. How long one may run, and each one's
# settings ([[command]]), are in device.toml.
#
#   #!/bin/sh -eu
#   printf 'Standup %s\n• today: %s\n' "$(date +%F)" "${1:-}"
[commands]
# Where the scripts live. Empty uses the `commands` folder beside this file.
dir = ""
